# DEV map-server fleet for the C# (.NET 10 NativeAOT) game server.
#
# This is the ONLY fleet manifest in this directory. The Go-image fleets
# (fleet-map*.yaml, fleet-dungeon*.yaml) were deleted: the Go game server was
# removed in 670a803 together with its Dockerfile, so those manifests described
# software that cannot be built and `kubectl apply` on them produced pods with
# no code behind them. There is no dungeon fleet yet — dungeon instancing is
# ADR-14 stage 6 and does not exist in the C# server, where `--mode=dungeon`
# only widens the disconnect hold window.
#
# Applied by k3s/setup-dev.sh. Validate before applying:
#   python3 ../k3s/validate-manifests.py
#   kubectl apply --dry-run=server -f fleet-map-dotnet-dev.yaml
#
# ---------------------------------------------------------------------------
# THE IMAGE TAG IS A CLAIM, NOT A FACT.
# ---------------------------------------------------------------------------
# `imagePullPolicy: IfNotPresent` on Docker Desktop resolves `rpg-mmo/
# gameserver-dotnet:dev` straight out of the host daemon's image store — no
# registry, no import. That convenience is also the trap: whatever `:dev`
# happened to point at last is what runs, and a fleet deployed against a stale
# `:dev` comes up green while proving nothing. This has already happened once —
# the `:dev` in the store on 2026-08-17 was built 5.4 hours BEFORE the commit
# that added the real Agones SDK, so a pod from it ran the no-op SDK while the
# manifest, the ADR and the operator all believed otherwise.
#
# So REBUILD AND VERIFY before every apply (docs/K3S.md "Deploying the dotnet
# fleet" has the copy-paste form):
#   cd backend && docker build -f deploy/docker/Dockerfile.gameserver-dotnet \
#       --build-arg GIT_REVISION="$(git rev-parse HEAD)" \
#       -t rpg-mmo/gameserver-dotnet:dev .
#   docker image inspect rpg-mmo/gameserver-dotnet:dev \
#       --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
#   # must equal `git rev-parse HEAD` of the branch under test
#
# On k3d/real k3s the store is NOT shared and the image must be imported:
#   k3d image import rpg-mmo/gameserver-dotnet:dev -c rpg-dev
#   docker save rpg-mmo/gameserver-dotnet:dev | sudo k3s ctr images import -
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: map-servers-dotnet-dev
  namespace: rpg-realtime
  labels:
    app.kubernetes.io/part-of: rpg-mmo
    rpg-mmo/role: map
    rpg-mmo/runtime: dotnet
spec:
  # ONE. Not a starting point to tune upwards.
  #
  # Every pod from this template carries the same GAMESERVER_MAP_ID and every
  # pod self-registers under it in Redis (ADR-14 decision 2). Two replicas
  # therefore means two servers claiming map_01 with two disconnected copies of
  # the world — ADR-2's one-live-server-per-map_id invariant broken by the
  # replica count alone, with no allocation involved. Scaling the map fleet
  # needs a per-pod map id first, which does not exist.
  replicas: 1
  scheduling: Packed
  template:
    metadata:
      labels:
        rpg-mmo/role: map
        rpg-mmo/runtime: dotnet
    spec:
      ports:
        # `name: game` is a CONTRACT, not a label. The gateway's allocator reads
        # the allocation response and picks the port whose name is exactly
        # "game" (gateway/registry/agones_allocator.go, const gamePortName);
        # renaming it makes every allocation fail with
        # `no "game" port in allocation status`.
        - name: game
          containerPort: 9000
          protocol: TCP  # UDP when the fleet moves to KCP; see TRANSPORT_KEY below
          # Dynamic on purpose — do NOT switch to Static.
          # Agones assigns the host port at scheduling time and reports it on
          # GameServer.status.ports. Static would make containerPort == hostPort
          # and let a literal address be configured, at the cost of what
          # `scheduling: Packed` is for: one GameServer per port per node, so the
          # second map server to land on this node collides with the first.
          # ADR-15 decision 2 considered and rejected it (option B).
          portPolicy: Dynamic
      # HEALTH IS DISABLED ON PURPOSE, AND THE REASON HAS CHANGED.
      #
      # The old reason ("the C# Agones SDK is a no-op") is NO LONGER TRUE.
      # Commit 62131f5 landed HttpAgonesSdk, which really does POST /ready,
      # /health, /allocate and /shutdown to the sidecar, with a health loop at a
      # 2s interval against the 5s periodSeconds below. The code exists.
      #
      # The reason it stays disabled is that NONE OF IT HAS EVER RUN AGAINST A
      # REAL SIDECAR. The SDK's tests stand a local HttpListener in for Agones;
      # no C# server in this project has reported Ready to an actual Agones pod.
      # ADR-14 stage 4 is exactly that experiment, and it is deliberately run
      # with health still disabled: a pod that fails to reach Ready then shows up
      # as a pod that failed to reach Ready, instead of as a restart loop that
      # hides which of image / secret / sidecar / SDK was wrong.
      #
      # REMOVING THIS LINE IS ITS OWN STEP, WITH ITS OWN CHECK. After stage 4
      # passes: delete `disabled: true`, apply, and watch the fleet for longer
      # than initialDelaySeconds + periodSeconds * failureThreshold (25s) to
      # confirm the ping keeps arriving under load, not just at startup. Do not
      # remove it because the SDK merged; the SDK merging is what made stage 4
      # runnable, not what proved it.
      #
      # The three timings are kept while inert so stage 4 does not have to
      # re-invent the policy: the Agones v1 Fleet schema has disabled,
      # initialDelaySeconds, periodSeconds and failureThreshold as four
      # independent optional properties.
      health:
        disabled: true
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 3
      template:
        spec:
          containers:
            - name: gameserver
              image: rpg-mmo/gameserver-dotnet:dev
              imagePullPolicy: IfNotPresent
              # Configuration is by environment, not by args.
              #
              # Both channels work (GameServer/Program.cs GetArg accepts
              # `--flag value` and `--flag=value` alike), but mixing them splits
              # the fleet's configuration across two blocks that a reader has to
              # merge by hand, and the env block is the one that matches
              # docker-compose.yml. There is deliberately no `args:` block at
              # all — even `--agones`, which has AGONES_ENABLED=true as its exact
              # env twin (Program.cs: `HasFlag("--agones") || AGONES_ENABLED ==
              # "true"`).
              env:
                # ---------------------------------------------------------
                # SERVER-ID CHAIN — POD_NAME must stay the ONLY source.
                # ---------------------------------------------------------
                # The join token is pinned to a server id (`sid` claim) and the
                # game server rejects any token whose sid is not its own
                # ("Token is for a different server",
                # GameServer/Server/GameServer.cs) — a mandatory check with no
                # empty-value bypass. The chain that has to hold:
                #
                #   Agones GameServer name -> pod name (Agones names the pod
                #   after the GameServer) -> POD_NAME -> serverId in Program.cs
                #   -> the Redis registry entry -> the `sid` the gateway signs
                #   -> what the pod compares against on join.
                #
                # DO NOT ADD GAMESERVER_ID HERE. Program.cs resolves
                # `--server-id ?? GAMESERVER_ID ?? POD_NAME ?? gs-<guid>`, so
                # GAMESERVER_ID WINS over POD_NAME. docker-compose.yml sets
                # GAMESERVER_ID=gs-dotnet-map_01 and is right to — one static
                # container, one static id. Copying that line into this env
                # block (the natural thing to do when the two are compared)
                # gives every pod in the fleet the same hardcoded id while the
                # allocator hands the client the GameServer's real name, and
                # every join is then rejected for a reason the error message
                # does not mention. The difference between the two env blocks
                # is deliberate.
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                # Turns on the Agones SDK path. With HttpAgonesSdk merged this
                # is no longer a no-op: the server POSTs /ready after it binds
                # and before it registers into Redis, then runs the health loop.
                - name: AGONES_ENABLED
                  value: "true"
                # AGONES_SDK_HTTP_PORT is deliberately NOT set. Agones injects it
                # into the game-server container itself, and the SDK reads it
                # with a 9358 default (GameServer/Agones/AgonesSdk.cs,
                # PortEnvVar/DefaultPort). Setting it here would pin a value that
                # the controller is free to change per pod. Confirm on the live
                # pod during stage 4:
                #   kubectl exec -n rpg-realtime <pod> -c gameserver -- env | grep AGONES
                - name: GAMESERVER_MODE
                  value: "map"
                - name: GAMESERVER_MAP_ID
                  value: "map_01"
                - name: GAMESERVER_ADDR
                  value: ":9000"
                # GAMESERVER_PUBLIC_ADDR IS ABSENT ON PURPOSE. DO NOT ADD IT.
                #
                # It is the address handed to the client verbatim in
                # MsgEnterWorldResp.ServerAddr, so it must be dialable BY THE
                # CLIENT. Under portPolicy: Dynamic the host port is chosen by
                # the scheduler at pod creation, so NO value written in this file
                # can be correct — a literal here is wrong for every pod except
                # by coincidence, and wrong silently: the gateway forwards it
                # without ever dialing it, and the client just fails to connect.
                #
                # The fix is not a manifest value. The server reads its own
                # address from the Agones sidecar's GameServer status
                # (status.address plus the port named "game") and registers THAT
                # — ADR-15 decision 2, option (A), in flight on
                # feat/gameserver/agones-status-address. Until that lands, the
                # server falls back to the listen address and advertises a
                # hostless ":9000"; a client cannot dial it, which is precisely
                # why ADR-14 stage 5 (end-to-end allocation) is blocked on the
                # status read and stage 4 (no restart loop) is not.
                #
                # Note also that status.address is the NODE address. It is
                # routable from wherever the node is routable and no further;
                # reaching it from a phone is an ingress question this does not
                # answer.
                - name: JWT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: rpg-realtime-secrets
                      key: jwt-secret
                # Verifies the gateway->gameserver join token. MUST hold the same
                # value as the gateway's JOIN_TOKEN_SECRET or every join fails
                # signature verification, and must NOT equal JWT_SECRET: this
                # value is on every game-server pod, so a compromised pod must
                # not be able to forge client auth tokens.
                #
                # Neither key is `optional: true`. A missing key fails container
                # creation with a visible CreateContainerConfigError, which is
                # what you want: `optional` on jwt-secret would start a server
                # that silently rejects every token, and the binary exits 2 on a
                # missing JOIN_TOKEN_SECRET anyway, i.e. a crash loop instead of
                # a clear config error.
                - name: JOIN_TOKEN_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: rpg-realtime-secrets
                      key: join-token-secret
                # Multi-rate simulation. SIM_CRITICAL_HZ is the BASE tick rate;
                # the other two must divide it exactly and must not exceed it, or
                # the container exits 2 at startup instead of rounding — which
                # Agones sees as a crash-looping GameServer, not as a silently
                # wrong rate. Snapshots are broadcast at the WORLD rate, so
                # SIM_WORLD_HZ is what moves bandwidth per client.
                # See backend/gameserver-dotnet/docs/README.md.
                - name: SIM_CRITICAL_HZ
                  value: "60"
                - name: SIM_WORLD_HZ
                  value: "15"
                - name: SIM_BACKGROUND_HZ
                  value: "5"
                # The data tier stays in docker compose ON THE HOST — that is
                # deliberate (ADR-15 decision 4 argues against a split, and this
                # fleet is the accepted exception for one stage, not a migration).
                # The value therefore has to name the HOST from inside a pod, and
                # that string is cluster-specific and NOT portable:
                # host.docker.internal on Docker Desktop, host.k3d.internal on
                # k3d, neither anywhere else. It lives in the ConfigMap rather
                # than here for exactly that reason — k3s/setup-dev.sh picks it
                # from the kubectl context, with a POD_REDIS_ADDR override.
                #
                # NOT `optional: true`. An absent ConfigMap would leave
                # REDIS_ADDR unset, and an unset REDIS_ADDR is not an error in
                # the server — it just runs without registering, so the pod is
                # Ready, the logs are clean, and the gateway can never find it.
                # A CreateContainerConfigError is the better failure.
                - name: REDIS_ADDR
                  valueFrom:
                    configMapKeyRef:
                      name: gameserver-config
                      key: redis-addr
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: rpg-realtime-secrets
                      key: redis-password
                      optional: true
                # /metrics + /healthz. Not published as an Agones port: nothing
                # scrapes the cluster yet (monitoring/prometheus.yaml scrapes the
                # compose network). Add a second named port when it does — but
                # NOT named "game".
                - name: METRICS_ADDR
                  value: ":9101"
                # Unset => in-memory player store, state lost on restart. The DSN
                # carries a password, so it belongs in the Secret, not the
                # ConfigMap, when it is turned on:
                # - name: GAME_DB_URL
                #   valueFrom:
                #     secretKeyRef:
                #       name: rpg-realtime-secrets
                #       key: game-db-url
                # KCP is not enabled on this fleet (protocol: TCP above), so
                # TRANSPORT_KEY is unused — and the server WARNS if it is set
                # while the transport is TCP, because the key is then ignored.
                # It is still carried in the Secret so that turning KCP on is a
                # two-line change here rather than a new secret-distribution
                # problem discovered at the wrong moment. To enable:
                #   protocol: UDP above, GAMESERVER_TRANSPORT=kcp here, the same
                #   TRANSPORT_KEY on the gateway, and ALLOCATOR_TRANSPORT=kcp so
                #   the gateway announces the right transport.
                # - name: GAMESERVER_TRANSPORT
                #   value: "kcp"
                # - name: TRANSPORT_KEY
                #   valueFrom:
                #     secretKeyRef:
                #       name: rpg-realtime-secrets
                #       key: transport-key
                # LOG_LEVEL was here and was removed: `grep -rn LOG_LEVEL
                # backend/gameserver-dotnet/GameServer/` returns nothing. The C#
                # server pins the console logger to Information in Program.cs and
                # reads no level from the environment, so the variable set a
                # value nobody consumed while reading as if verbosity were
                # configured. Do not re-add it until the binary reads it.
              # Sized against measurement, not against habit
              # (backend/docs/BENCHMARK.md): ~30 MiB resident idle, ~50 MiB at
              # 100 players, ~82 MiB at 200 — the highest number the benchmark
              # ever recorded. 128Mi request sits above the working set the pod
              # actually holds most of the time; 256Mi limit is ~3x the measured
              # peak, which is the headroom the GC wants and no more.
              #
              # CPU limit raised 500m -> 1000m. At 200 players the benchmark
              # measured 47.3% of one core, i.e. ~473m, which is INSIDE a 500m
              # limit only by rounding — and CFS throttling there does not show
              # up as "slow", it shows up as missed ticks, and once health is
              # enabled a throttled server is a killed server. The box is 12
              # cores and runs one of these pods; a limit that is never reached
              # costs nothing. The 200m request is unchanged and still generous:
              # idle is ~3% of a core, and NativeAOT cold start is 1.54s from
              # `docker run` to "Game server listening", so there is no burst at
              # startup to reserve for either.
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "200m"
                limits:
                  memory: "256Mi"
                  cpu: "1000m"
