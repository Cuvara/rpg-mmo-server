# DEV variant of fleet-map.yaml for the .NET (C#) game server.
#
# Identical to fleet-map-dev.yaml except:
#   * image        : rpg-mmo/gameserver-dotnet:dev
#   * resources    : higher baseline (NativeAOT binary uses ~30-45MB vs Go ~20MB)
#                    requests 200m CPU / 128Mi, limits 500m CPU / 256Mi
#
# Image must be present in the cluster's image store:
#   Docker Desktop k8s : nothing to do — it shares the Docker image store.
#   k3d                : k3d image import rpg-mmo/gameserver-dotnet:dev -c rpg-dev
#   real k3s           : docker save rpg-mmo/gameserver-dotnet:dev | \
#                          sudo k3s ctr images import -
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: map-servers-dotnet-dev
  namespace: rpg-realtime
  labels:
    app.kubernetes.io/part-of: rpg-mmo
    rpg-mmo/role: map
    rpg-mmo/runtime: dotnet
spec:
  replicas: 1
  scheduling: Packed
  template:
    metadata:
      labels:
        rpg-mmo/role: map
        rpg-mmo/runtime: dotnet
    spec:
      ports:
        - name: game
          containerPort: 9000
          protocol: TCP
          portPolicy: Dynamic
      # HEALTH IS DISABLED ON PURPOSE — do not "fix" this by removing the flag.
      #
      # The C# server's Agones SDK is a no-op: GameServer/Agones/AgonesSdk.cs
      # contains only NoopAgonesSdk, whose HealthAsync returns Task.CompletedTask
      # without touching the sidecar. `--agones` below parses, logs a warning and
      # changes nothing. With health enabled, the pod therefore fails every check,
      # trips failureThreshold and is killed and recreated forever — Agones is
      # right, there is genuinely no liveness signal.
      #
      # WHAT REMOVES THIS: ADR-14 stage 1 lands `HttpAgonesSdk` (the real sidecar
      # client on localhost:9358) — the Ready-then-register ordering already exists
      # in GameServer/Server/GameServer.cs, only the SDK behind it is missing.
      # Stage 4 then deploys this fleet WITH the flag still set and confirms the pod
      # reaches Ready; deleting the `disabled: true` line is the step AFTER that,
      # with its own check that the pod survives the ping period. Do not remove it
      # merely because the SDK merged.
      # See backend/docs/ARCHITECTURE-DECISIONS.md ADR-14 decision 4.
      #
      # The three timing values below are kept deliberately. The Agones v1 Fleet
      # schema (verified against CRD fleets.agones.dev: health has four
      # independent optional properties — disabled, initialDelaySeconds,
      # periodSeconds, failureThreshold) accepts them alongside `disabled: true`;
      # they are simply inert while it is set, so the intended policy survives in
      # the file instead of having to be re-invented at stage 4.
      health:
        disabled: true
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 3
      template:
        spec:
          containers:
            - name: gameserver
              image: rpg-mmo/gameserver-dotnet:dev
              imagePullPolicy: IfNotPresent
              args:
                - "--mode=map"
                - "--map-id=map_01"
                - "--addr=:9000"
                # No effect today beyond a startup warning — the C# server's SDK
                # is a no-op, so no Ready/Health/Shutdown reaches the sidecar
                # (ADR-14). Kept so stage 2 needs no manifest change to switch on.
                - "--agones"
                # Uncomment to share the registry/event stream with a gateway
                # running outside the cluster (needs REDIS_ADDR below):
                # - "--redis"
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: JWT_SECRET
                  value: "dev-secret-change-me"
                # Signs/verifies the gateway->gameserver join token. Must match the
                # gateway's JOIN_TOKEN_SECRET, and is deliberately NOT JWT_SECRET.
                - name: JOIN_TOKEN_SECRET
                  value: "dev-join-secret-change-me"
                # Multi-rate simulation. SIM_CRITICAL_HZ is the BASE tick rate;
                # the other two must divide it exactly and must not exceed it, or
                # the container exits 2 at startup instead of rounding — which
                # Agones sees as a crash-looping GameServer, not as a silently
                # wrong rate. Snapshots are broadcast at the WORLD rate, so
                # SIM_WORLD_HZ is what moves bandwidth per client.
                # See backend/gameserver-dotnet/docs/README.md.
                - name: SIM_CRITICAL_HZ
                  value: "60"
                - name: SIM_WORLD_HZ
                  value: "15"
                - name: SIM_BACKGROUND_HZ
                  value: "5"
                - name: REDIS_ADDR
                  value: "host.docker.internal:6379"
                # Leave GAME_DB_URL unset => in-memory player store. To persist:
                # - name: GAME_DB_URL
                #   value: "postgres://game:localdev@host.docker.internal:5433/gamestate?sslmode=disable"
                - name: LOG_LEVEL
                  value: "debug"
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "200m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
