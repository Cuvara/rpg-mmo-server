# ⚠️ SUPERSEDED — this fleet runs the DELETED Go game server.
#
# `rpg-mmo/gameserver:dev` was built from backend/gameserver/, removed in
# 670a803 "feat(migration): remove Go gameserver, C# .NET 10 is primary".
# docker/Dockerfile.gameserver is gone too, so the image cannot even be rebuilt.
# Nothing in this file describes code that exists. The replacement is
# fleet-map-dotnet-dev.yaml (image rpg-mmo/gameserver-dotnet:dev).
#
# Kept rather than deleted, on purpose: the cluster still RUNS `map-servers-dev`
# from this manifest (created 13 days before ADR-14 was written), and deleting
# the file would leave a live fleet with no source describing it. ADR-14 stage 8
# owns the deletion, together with the `kubectl delete fleet` that retires the
# running one — the two must happen in one step, in that order.
# See backend/docs/ARCHITECTURE-DECISIONS.md ADR-14 and docs/K3S.md "Which fleet
# is real".
#
# Everything below is historical. Do not apply it.
#
# DEV variant of fleet-map.yaml — for a LOCAL cluster (Docker Desktop
# Kubernetes / k3d), applied by k3s/setup-dev.sh.
#
# Differences from the production fleet:
#   * image        : locally built rpg-mmo/gameserver:dev (ghcr.io image is not
#                    published yet — see docs/K3S.md "Images").
#   * pullPolicy   : IfNotPresent, so the cluster never tries to pull it.
#   * replicas     : 1 (a laptop does not need a buffer).
#   * env          : literal dev values instead of Secret/ConfigMap refs.
#   * deps         : none. The gameserver runs with the in-memory registry and
#                    in-memory player store, so the fleet reaches Ready with no
#                    Redis/Postgres in the cluster. Uncomment the `--redis`
#                    arg + GAME_DB_URL env to point at the host compose stack
#                    via host.docker.internal (docs/K3S.md "Talking to the host").
#
# Image must be present in the cluster's image store:
#   Docker Desktop k8s : nothing to do — it shares the Docker image store.
#   k3d                : k3d image import rpg-mmo/gameserver:dev -c rpg-dev
#   real k3s           : docker save rpg-mmo/gameserver:dev | \
#                          sudo k3s ctr images import -
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: map-servers-dev
  namespace: rpg-realtime
  labels:
    app.kubernetes.io/part-of: rpg-mmo
    rpg-mmo/role: map
spec:
  replicas: 1
  scheduling: Packed
  template:
    metadata:
      labels:
        rpg-mmo/role: map
    spec:
      # Dynamic (the default): Agones assigns a free host port and publishes it
      # on GameServer.status.ports. The container itself always binds :9000.
      ports:
        - name: game
          containerPort: 9000
          protocol: TCP
          portPolicy: Dynamic
      # Health is driven by the SDK sidecar: the gameserver's health loop calls
      # sdk.Health() (gameserver/agones/sdk.go StartHealthLoop). No HTTP probe —
      # the runtime image is distroless.
      health:
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 3
      template:
        spec:
          containers:
            - name: gameserver
              image: rpg-mmo/gameserver:dev
              imagePullPolicy: IfNotPresent
              args:
                - "--mode=map"
                - "--map-id=map_01"
                - "--addr=:9000"
                # Calls sdk.Ready() once the listener is up; without this the
                # GameServer never leaves Scheduled and Agones kills the pod.
                - "--agones"
                # Uncomment to share the registry/event stream with a gateway
                # running outside the cluster (needs REDIS_ADDR below):
                # - "--redis"
              env:
                # Server-id contract: the gameserver uses POD_NAME as its
                # --server-id (gameserver/cmd/gameserver resolveServerID), so the
                # id it registers equals the GameServer name the gateway gets
                # back from a GameServerAllocation — that name is what the
                # gateway signs into the join token's sid.
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: JWT_SECRET
                  value: "dev-secret-change-me"
                # Signs/verifies the gateway->gameserver join token. Must match the
                # gateway's JOIN_TOKEN_SECRET, and is deliberately NOT JWT_SECRET.
                - name: JOIN_TOKEN_SECRET
                  value: "dev-join-secret-change-me"
                # Host compose stack (docker-compose.yml) as seen from a pod on
                # Docker Desktop Kubernetes. On k3d use host.k3d.internal.
                - name: REDIS_ADDR
                  value: "host.docker.internal:6379"
                # Leave GAME_DB_URL unset => in-memory player store. To persist:
                # - name: GAME_DB_URL
                #   value: "postgres://game:localdev@host.docker.internal:5433/gamestate?sslmode=disable"
                - name: LOG_LEVEL
                  value: "debug"
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "100m"
                limits:
                  memory: "128Mi"
                  cpu: "500m"
