apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: dungeon-servers
  namespace: rpg-realtime
spec:
  replicas: 0  # Scale from 0 — allocate on demand
  scheduling: Packed
  template:
    spec:
      ports:
        - name: game
          containerPort: 9000
          protocol: TCP
      health:
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 3
      template:
        spec:
          containers:
            - name: gameserver
              image: ghcr.io/dycuong03/rpg-mmo-gameserver:latest
              args:
                - "--mode=dungeon"
                - "--agones"
                - "--addr=:9000"
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "100m"
                limits:
                  memory: "128Mi"
                  cpu: "500m"
