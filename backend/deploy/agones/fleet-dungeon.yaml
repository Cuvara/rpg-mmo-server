# ⚠️ SUPERSEDED — Go-image fleet, never deployed anywhere. See the banner in
# fleet-map.yaml: the image is the deleted Go server's and the tag was never
# published. Dungeon instancing itself is ADR-14 stage 6, unimplemented.
#
# Production dungeon-server fleet. See fleet-map.yaml for the config-source
# contract (Secret rpg-realtime-secrets / ConfigMap gameserver-config).
#
# For a local cluster use fleet-dungeon-dev.yaml instead.
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: dungeon-servers
  namespace: rpg-realtime
  labels:
    app.kubernetes.io/part-of: rpg-mmo
    rpg-mmo/role: dungeon
spec:
  replicas: 0  # Scale from 0 — allocate on demand
  scheduling: Packed
  template:
    metadata:
      labels:
        rpg-mmo/role: dungeon
    spec:
      ports:
        - name: game
          containerPort: 9000
          protocol: TCP
          portPolicy: Dynamic
      health:
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 3
      template:
        spec:
          containers:
            - name: gameserver
              image: ghcr.io/dycuong03/rpg-mmo-gameserver:latest
              args:
                - "--mode=dungeon"
                - "--agones"
                - "--addr=:9000"
                - "--redis"
              env:
                # Server-id contract: the gameserver uses POD_NAME as its
                # --server-id (gameserver/cmd/gameserver resolveServerID), so the
                # id it registers equals the GameServer name the gateway gets
                # back from a GameServerAllocation — that name is what the
                # gateway signs into the join token's sid.
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: JWT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: rpg-realtime-secrets
                      key: jwt-secret
                      optional: true
                # Verifies the gateway->gameserver join token. Must hold the same
                # value as the gateway's JOIN_TOKEN_SECRET, and must NOT be
                # JWT_SECRET: a compromised game-server pod must not be able to
                # forge client auth tokens. Not optional -- the binary refuses to
                # start without it, so a missing key should fail at container
                # creation rather than crashloop.
                - name: JOIN_TOKEN_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: rpg-realtime-secrets
                      key: join-token-secret
                - name: REDIS_ADDR
                  valueFrom:
                    configMapKeyRef:
                      name: gameserver-config
                      key: redis-addr
                      optional: true
                - name: GAME_DB_URL
                  valueFrom:
                    configMapKeyRef:
                      name: gameserver-config
                      key: game-db-url
                      optional: true
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "100m"
                limits:
                  memory: "128Mi"
                  cpu: "500m"
