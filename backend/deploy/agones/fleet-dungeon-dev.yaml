# ⚠️ SUPERSEDED — this fleet runs the DELETED Go game server.
#
# Same story as fleet-map-dev.yaml (read the banner there): image
# `rpg-mmo/gameserver:dev` came from backend/gameserver/, removed in 670a803, and
# its Dockerfile is gone. The cluster still runs `dungeon-servers-dev` from this
# manifest, which is why the file is marked instead of deleted. There is no
# dotnet dungeon fleet yet — dungeon instancing is ADR-14 stage 6 and does not
# exist in the C# server, where `--mode=dungeon` only widens the disconnect hold
# window. Retirement of both file and running fleet is ADR-14 stage 8.
#
# Everything below is historical. Do not apply it.
#
# DEV variant of fleet-dungeon.yaml — see fleet-map-dev.yaml for the rationale.
#
# replicas: 0 on purpose. Dungeons are allocated on demand:
#   kubectl create -f agones/allocation-dev.yaml
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: dungeon-servers-dev
  namespace: rpg-realtime
  labels:
    app.kubernetes.io/part-of: rpg-mmo
    rpg-mmo/role: dungeon
spec:
  replicas: 0
  scheduling: Packed
  template:
    metadata:
      labels:
        rpg-mmo/role: dungeon
    spec:
      ports:
        - name: game
          containerPort: 9000
          protocol: TCP
          portPolicy: Dynamic
      health:
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 3
      template:
        spec:
          containers:
            - name: gameserver
              image: rpg-mmo/gameserver:dev
              imagePullPolicy: IfNotPresent
              args:
                - "--mode=dungeon"
                - "--addr=:9000"
                - "--agones"
              env:
                # Server-id contract: the gameserver uses POD_NAME as its
                # --server-id (gameserver/cmd/gameserver resolveServerID), so the
                # id it registers equals the GameServer name the gateway gets
                # back from a GameServerAllocation — that name is what the
                # gateway signs into the join token's sid.
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: JWT_SECRET
                  value: "dev-secret-change-me"
                # Signs/verifies the gateway->gameserver join token. Must match the
                # gateway's JOIN_TOKEN_SECRET, and is deliberately NOT JWT_SECRET.
                - name: JOIN_TOKEN_SECRET
                  value: "dev-join-secret-change-me"
                - name: REDIS_ADDR
                  value: "host.docker.internal:6379"
                - name: LOG_LEVEL
                  value: "debug"
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "100m"
                limits:
                  memory: "128Mi"
                  cpu: "500m"
