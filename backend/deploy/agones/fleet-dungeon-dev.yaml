# DEV variant of fleet-dungeon.yaml — see fleet-map-dev.yaml for the rationale.
#
# replicas: 0 on purpose. Dungeons are allocated on demand:
#   kubectl create -f agones/allocation-dev.yaml
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: dungeon-servers-dev
  namespace: rpg-realtime
  labels:
    app.kubernetes.io/part-of: rpg-mmo
    rpg-mmo/role: dungeon
spec:
  replicas: 0
  scheduling: Packed
  template:
    metadata:
      labels:
        rpg-mmo/role: dungeon
    spec:
      ports:
        - name: game
          containerPort: 9000
          protocol: TCP
          portPolicy: Dynamic
      health:
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 3
      template:
        spec:
          containers:
            - name: gameserver
              image: rpg-mmo/gameserver:dev
              imagePullPolicy: IfNotPresent
              args:
                - "--mode=dungeon"
                - "--addr=:9000"
                - "--agones"
              env:
                - name: JWT_SECRET
                  value: "dev-secret-change-me"
                - name: REDIS_ADDR
                  value: "host.docker.internal:6379"
                - name: LOG_LEVEL
                  value: "debug"
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "100m"
                limits:
                  memory: "128Mi"
                  cpu: "500m"
