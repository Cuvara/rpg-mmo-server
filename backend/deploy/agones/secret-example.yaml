# TEMPLATE — do not apply this file as-is, and do not put real values in it.
#
# Every value below is a DEV PLACEHOLDER, identical to the defaults in
# ../.env.example. They are published in this repo, so they are secret in name
# only. Anything shared or reachable gets values from `openssl rand -hex 32`.
#
# ---------------------------------------------------------------------------
# HOW TO CREATE IT — from ../.env, never by hand
# ---------------------------------------------------------------------------
# The single hard requirement is that these values MATCH THE GATEWAY's. The
# gateway runs in docker compose and reads backend/deploy/.env; if the Secret in
# the cluster and .env disagree, the gateway mints a join token the game server
# cannot verify and EVERY join fails signature verification — with no error at
# the point where the mistake was made. So do not type the values twice.
# Generate the Secret FROM .env:
#
#   cd backend/deploy
#   set -a; . ./.env; set +a
#   kubectl create secret generic rpg-realtime-secrets \
#     --namespace rpg-realtime \
#     --from-literal=jwt-secret="$JWT_SECRET" \
#     --from-literal=join-token-secret="$JOIN_TOKEN_SECRET" \
#     --from-literal=redis-password="${REDIS_PASSWORD:-}" \
#     --from-literal=transport-key="${TRANSPORT_KEY:-}" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# k3s/setup-dev.sh runs exactly that. RE-RUN IT AFTER EVERY .env CHANGE:
# a Secret update does not restart running pods, so also
# `kubectl rollout restart` is not available for Fleets — delete the fleet's
# GameServers (`kubectl delete gs -n rpg-realtime -l agones.dev/fleet=map-servers-dotnet-dev`)
# and let Agones recreate them.
#
# ---------------------------------------------------------------------------
# WHAT THE FLEET NEEDS, AND WHY EACH ONE
# ---------------------------------------------------------------------------
#   jwt-secret        -> JWT_SECRET        HS256 secret for client auth tokens.
#                                          Server only WARNS when unset, so a
#                                          wrong value shows up as "all tokens
#                                          rejected", not as a config error.
#   join-token-secret -> JOIN_TOKEN_SECRET HS256 secret the gateway signs join
#                                          tokens with. MANDATORY — the server
#                                          exits 2 without it. Deliberately NOT
#                                          the same value as jwt-secret: this one
#                                          is on every game-server pod, so a
#                                          compromised pod must not be able to
#                                          forge client auth tokens. Rotate with
#                                          a comma-separated "new,old" pair; both
#                                          are accepted while the rotation runs.
#   redis-password    -> REDIS_PASSWORD    Empty unless redis runs with
#                                          --requirepass. Optional in the fleet.
#   transport-key     -> TRANSPORT_KEY     Pre-shared AES-256 key for KCP. UNUSED
#                                          today (the fleet is TCP) and carried
#                                          anyway, so enabling KCP is a manifest
#                                          change and not a new secret-delivery
#                                          problem. 64 hex chars are used
#                                          verbatim; anything else is stretched
#                                          with HKDF-SHA256. Must be byte-identical
#                                          to the gateway's or no packet decrypts.
#   game-db-url       -> GAME_DB_URL       Not set today (in-memory player store).
#                                          It is a DSN WITH A PASSWORD IN IT, so
#                                          when persistence is turned on it goes
#                                          here and not in the gameserver-config
#                                          ConfigMap.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE IS A TEMPLATE AND NOT THE THING ITSELF
# ---------------------------------------------------------------------------
# `stringData` in a committed manifest is a plaintext secret in git history the
# moment someone edits it with a real value. ../.gitignore ignores `.env` and
# `agones/secret-*.local.yaml`; if you must materialise a filled-in copy, name it
# `secret-rpg-realtime.local.yaml` so it cannot be committed by accident.
apiVersion: v1
kind: Secret
metadata:
  # NOT the name the fleet references (`rpg-realtime-secrets`), on purpose:
  # `kubectl apply -f agones/` must not be able to overwrite a real Secret with
  # these published placeholders. Applying this file creates an unused object.
  name: rpg-realtime-secrets-example
  namespace: rpg-realtime
  labels:
    app.kubernetes.io/part-of: rpg-mmo
type: Opaque
stringData:
  jwt-secret: "dev-secret-change-me"
  join-token-secret: "dev-join-secret-change-me"
  redis-password: ""
  transport-key: ""
