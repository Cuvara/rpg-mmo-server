# Prometheus config for the bundled Prometheus inside grafana/otel-lgtm.
#
# The image reads /otel-lgtm/prometheus.yaml, so this file REPLACES the image's
# default — the `otlp:` and `storage:` blocks below are copied verbatim from
# that default (0.11.15) and must be kept when bumping the image tag:
#   docker run --rm --entrypoint sh grafana/otel-lgtm:<tag> \
#     -c 'cat /otel-lgtm/prometheus.yaml'
#
# Everything OTLP-pushed (traces/metrics/logs via 4317/4318) keeps working; the
# scrape_configs below are purely additive — our Go/C#/Nakama processes expose
# plain Prometheus endpoints and are pulled.

otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name

storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: dev

scrape_configs:
  # Nakama meta server — runs in this compose project, reachable by service name.
  - job_name: nakama
    static_configs:
      - targets: ["nakama:9100"]
        labels:
          service: nakama

  # Realtime processes normally run on the HOST during dev (`go run` /
  # `dotnet run`), so they are scraped through host.docker.internal — the
  # compose service adds an extra_hosts entry so this also resolves on a plain
  # Linux Docker engine.
  #
  # 9101 = C# game server, 9102 = Go gateway (`--metrics-addr`).
  # A target stays DOWN until that process is running; that is expected in a
  # partial dev stack.
  - job_name: gameserver
    static_configs:
      - targets: ["host.docker.internal:9101"]
        labels:
          service: gameserver

  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:9102"]
        labels:
          service: gateway

  # Containerised variants (docker compose --profile realtime / realtime-dotnet).
  # Down when those profiles are not up — harmless.
  - job_name: gameserver-container
    static_configs:
      - targets: ["gameserver-dotnet:9101"]
        labels:
          service: gameserver
    honor_labels: true

  - job_name: gateway-container
    static_configs:
      - targets: ["gateway:9102"]
        labels:
          service: gateway
    honor_labels: true
