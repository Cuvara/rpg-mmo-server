# Local dev meta stack: PostgreSQL (meta DB) + Nakama (with our Go plugin).
#
# Realtime services (gateway, gameserver) are NOT in the default stack — plain
# `docker compose up` still brings up only the backing services. They live
# behind the `realtime` profile, which is what CD's DEPLOY_MODE=containers uses
# and what container-parity testing uses locally; DEPLOY_MODE=host and
# interactive dev instead run them on the host (see docs/RUNBOOK-local-dev.md).
#
# Usage:
#   make flow-up      # ONE COMMAND: build everything + run the whole backend
#   make flow-check   # prove the full client flow against it (smoketest)
#   make flow-down    # tear it down
#
# Or piecemeal:
#   make plugin && make up
#   docker compose --profile realtime up -d   # + containerized gateway/gameserver
#
# Running a SECOND, isolated stack beside a live one: set COMPOSE_PROJECT_NAME
# (own network + volumes), COMPOSE_NAME_PREFIX (own container names) and offset
# every published port. `make flow-up SCRATCH=1` does exactly that.
#
# All image tags are pinned. Bump NAKAMA_VERSION in .env and in
# nakama-plugin.Dockerfile together — the plugin ABI must match the server.

name: rpg-mmo-meta

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: ${COMPOSE_NAME_PREFIX:-rpg}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nakama}
      POSTGRES_USER: ${POSTGRES_USER:-nakama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      # Faster startup for a throwaway dev volume.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nakama} -d ${POSTGRES_DB:-nakama}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Second PostgreSQL instance: game state (player_states, ...). Deliberately
  # separate from the Nakama meta DB above — see root CLAUDE.md ("PostgreSQL:
  # 2 instances"). Host port defaults to 5433 so both can run side by side.
  # Host-run gameserver connects with:
  #   GAME_DB_URL=postgres://game:localdev@localhost:5433/gamestate?sslmode=disable
  postgres-game:
    image: postgres:16.4-alpine
    container_name: ${COMPOSE_NAME_PREFIX:-rpg}-postgres-game
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_GAME_DB:-gamestate}
      POSTGRES_USER: ${POSTGRES_GAME_USER:-game}
      POSTGRES_PASSWORD: ${POSTGRES_GAME_PASSWORD:-localdev}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${POSTGRES_GAME_PORT:-5433}:5432"
    volumes:
      - postgres-game-data:/var/lib/postgresql/data
      # Applied once, on an empty data volume. Schema changes do NOT go here —
      # the gameserver applies numbered migrations from db/migrations/gamestate/
      # at boot (and CD runs them explicitly beforehand), which is what upgrades
      # an existing volume. See backend/deploy/docs/DATABASE.md.
      - ./db/init-gamestate.sql:/docker-entrypoint-initdb.d/10-init-gamestate.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_GAME_USER:-game} -d ${POSTGRES_GAME_DB:-gamestate}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  nakama:
    image: heroiclabs/nakama:${NAKAMA_VERSION:-3.40.0}
    container_name: ${COMPOSE_NAME_PREFIX:-rpg}-nakama
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Shared HS256 secret. MUST match JWT_SECRET used by gateway/gameserver
      # (backend/shared/config: env JWT_SECRET, default "dev-secret-change-me").
      # Nakama signs client session tokens with session.encryption_key, so the
      # gateway can verify them locally with no roundtrip.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      # DEV ONLY. The nakama plugin now creates the kills_alltime leaderboard
      # authoritative and refuses to load if an existing board is not (audit
      # F02). Stacks created before that hold the old board; this makes the
      # plugin delete and recreate it on start-up, DISCARDING its records —
      # fine for a local stack, never for staging/prod, which flip the row with
      # SQL instead (backend/nakama/docs/RUNBOOK.md, "Migrate a
      # non-authoritative kills_alltime leaderboard", path A).
      LEADERBOARD_MIGRATE: recreate
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /nakama/nakama migrate up \
          --database.address "${POSTGRES_USER:-nakama}:${POSTGRES_PASSWORD:-localdev}@postgres:5432/${POSTGRES_DB:-nakama}"
        exec /nakama/nakama \
          --name rpg-nakama-local \
          --database.address "${POSTGRES_USER:-nakama}:${POSTGRES_PASSWORD:-localdev}@postgres:5432/${POSTGRES_DB:-nakama}" \
          --logger.level DEBUG \
          --session.token_expiry_sec 7200 \
          --session.encryption_key "$${JWT_SECRET}" \
          --session.refresh_encryption_key "$${JWT_SECRET}-refresh" \
          --runtime.path /nakama/data/modules \
          --console.username "${NAKAMA_CONSOLE_USER:-admin}" \
          --console.password "${NAKAMA_CONSOLE_PASSWORD:-password}" \
          --socket.server_key "${NAKAMA_SERVER_KEY:-defaultkey}" \
          --runtime.http_key "${NAKAMA_HTTP_KEY:-defaulthttpkey}" \
          --metrics.prometheus_port 9100
    ports:
      - "${NAKAMA_GRPC_PORT:-7349}:7349"      # gRPC API
      - "${NAKAMA_HTTP_PORT:-7350}:7350"      # HTTP API / client
      - "${NAKAMA_CONSOLE_PORT:-7351}:7351"   # Console (web UI)
      - "${NAKAMA_METRICS_PORT:-9100}:9100"   # Prometheus metrics
    volumes:
      # Compiled Go plugin (nakama.so) is dropped here by `make plugin`.
      - ./modules:/nakama/data/modules
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: ${COMPOSE_NAME_PREFIX:-rpg}-redis
    restart: unless-stopped
    environment:
      # Empty = no auth, matching backend/shared/config default (REDIS_PASSWORD="").
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # --requirepass is added only when REDIS_PASSWORD is non-empty.
    # AOF on: session/registry keys survive a container restart during dev.
    #
    # maxmemory-policy MUST stay `noeviction`. This Redis is a system of record
    # for the server registry (servers:*) and the event stream (events:*), not a
    # cache: evicting a registry hash silently removes a live game server from
    # matchmaking, and trimming a stream drops unacked cross-server events.
    # Sessions are the only genuinely expendable keys and they carry their own
    # TTL. `noeviction` is already the Redis default, but it is set explicitly so
    # that a `--maxmemory` limit cannot silently turn this into an LRU cache.
    # See backend/docs/ARCHITECTURE-DECISIONS.md, ADR-4.
    #
    # `--maxmemory 128mb` is the ceiling that makes `noeviction` safe rather than
    # merely strict (#202): without it nothing bounds growth and the process is
    # OOM-killed whole instead of refusing writes with `OOM command not allowed`.
    # The value mirrors deploy/k8s/data/redis.conf, which carries the arithmetic
    # against the cluster pod's 256Mi limit. Compose has no memory limit of its
    # own, so here the flag exists to keep dev and cluster in step — a divergence
    # is how "it worked locally" happens.
    command:
      - /bin/sh
      - -ec
      - |
        exec redis-server \
          --appendonly yes \
          --appendfsync everysec \
          --save 60 1000 \
          --maxmemory-policy noeviction \
          --maxmemory 128mb \
          $${REDIS_PASSWORD:+--requirepass "$${REDIS_PASSWORD}"}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$${REDIS_PASSWORD}\"} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # ------------------------------------------------------------- realtime
  # Profile-gated: started with `docker compose --profile realtime up -d`.
  #
  # This is the DEPLOY_MODE=containers path (see docs/CICD.md): CD builds both
  # images on the runner and brings them up here, and they take over the
  # canonical ports. DEPLOY_MODE=host instead runs the same binaries directly
  # from $RPG_DEPLOY_DIR/bin via scripts/deploy-local.sh, and this profile stays
  # down. Interactive local dev normally keeps using the host path (`go run` /
  # `dotnet run`) for instant rebuilds and a debugger.
  #
  # Build them first (contexts differ, see the Dockerfile headers):
  #   docker build -f docker/Dockerfile.gateway           -t rpg-mmo/gateway:dev ..
  #   docker build -f docker/Dockerfile.gameserver-dotnet -t rpg-mmo/gameserver-dotnet:dev ..
  # or: scripts/build-all.sh --images
  #
  # Published host ports default to the OFFSET values (8100 / 9200 / …) so a
  # host-run gateway on :8000 can coexist; CD's containers mode overrides
  # GATEWAY_CONTAINER_PORT=8000 in deploy/.env so the containers own the
  # canonical ports instead.
  gateway:
    profiles: ["realtime"]
    image: ${GATEWAY_IMAGE:-rpg-mmo/gateway:dev}
    container_name: ${COMPOSE_NAME_PREFIX:-rpg}-gateway
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["--addr=:8000", "--backend=redis"]
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      # Signs the gateway→gameserver join token. Deliberately NOT JWT_SECRET —
      # a compromised game server must not be able to forge client auth tokens.
      # The gameserver-dotnet service below must carry the identical value.
      JOIN_TOKEN_SECRET: ${JOIN_TOKEN_SECRET:-dev-join-secret-change-me}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # ---------------------------------------------------------------------
      # Gateway-hop TLS (ADR-23) — OFF, and pinned explicitly.
      # ---------------------------------------------------------------------
      # The gateway hop carries the client's auth token: a ONE-HOUR REUSABLE
      # bearer credential, measured crossing this hop in the clear. Setting
      # both of these to PEM paths inside the container makes the gateway
      # terminate TLS itself and closes that.
      #
      # It is empty here for one reason, and it is not caution: THE UNITY
      # CLIENT CANNOT SPEAK TLS TO THE GATEWAY YET. Turning this on with the
      # current client refuses every player — there is deliberately no
      # plaintext fallback (ADR-23 decision 3), because a listener that accepts
      # both is a downgrade attack with a friendly name.
      #
      # Setting exactly ONE of the two is a startup ERROR, not a fall back to
      # plaintext.
      #
      # It does NOT cover the client→Nakama hop, which MINTS that auth token
      # and is plain HTTP in this file (the nakama service has no
      # --socket.ssl_certificate). That hop also carries a TWO-HOUR reusable
      # Nakama session token, so it is the higher-value half and turning this
      # on alone buys less than it looks like it does.
      GATEWAY_TLS_CERT: ${GATEWAY_TLS_CERT:-}
      GATEWAY_TLS_KEY: ${GATEWAY_TLS_KEY:-}
      # Prometheus endpoint (/metrics, /healthz). Scraped in-network by the
      # `monitoring` profile as gateway:9102; set to "off" to disable.
      METRICS_ADDR: ":9102"
      # ---------------------------------------------------------------------
      # Agones allocator — OPT-IN, and off by default on purpose.
      # ---------------------------------------------------------------------
      # The deploy path is NOT moving to Kubernetes: the gateway stays here in
      # compose and only the game servers run under Agones (ADR-15 decision 4
      # accepts that split for this one stage). So the gateway allocates
      # OUT-OF-CLUSTER, over the Kubernetes API, and needs a kubeconfig — see
      # the volumes block below and docs/K3S.md "Allocating from the
      # compose-run gateway".
      #
      # Default `none`: with no allocator, an unserved map is simply an error,
      # and the whole stack keeps working with no cluster present at all.
      # Setting ALLOCATOR=agones without a reachable cluster is FATAL — the
      # gateway exits 1 at construction rather than starting degraded.
      ALLOCATOR: ${ALLOCATOR:-none}
      # These must name the fleets that actually exist. The Go defaults
      # (map-servers-dev / dungeon-servers-dev) name the RETIRED Go fleets, so
      # leaving them unset points allocation at nothing.
      ALLOCATOR_NAMESPACE: ${ALLOCATOR_NAMESPACE:-rpg-realtime}
      ALLOCATOR_FLEET_MAP: ${ALLOCATOR_FLEET_MAP:-map-servers-dotnet-dev}
      # No dungeon fleet exists (ADR-14 stage 6). Left at the Go default so it
      # is obviously wrong if anything ever asks for one, rather than pointing
      # at a plausible name that is equally absent.
      ALLOCATOR_FLEET_DUNGEON: ${ALLOCATOR_FLEET_DUNGEON:-}
      # What the FLEET's servers listen with, not what this gateway listens
      # with. It is stamped onto the allocated ServerInfo and announced to the
      # client BEFORE the pod's own registration lands, so a mismatch tells the
      # client to speak the wrong protocol. The fleet is TCP today.
      ALLOCATOR_TRANSPORT: ${ALLOCATOR_TRANSPORT:-tcp}
      # Path INSIDE the container. The kubeconfig itself is mounted by the
      # docker-compose.agones.yml overlay, NOT here: a bind mount of a file
      # that does not exist makes compose create a DIRECTORY in its place, so
      # putting it in the base file would break the default no-cluster stack
      # for everyone who never wants an allocator.
      #   docker compose -f docker-compose.yml -f docker-compose.agones.yml up -d
      ALLOCATOR_KUBECONFIG: ${ALLOCATOR_KUBECONFIG:-/etc/rpg/kubeconfig}
    ports:
      - "${GATEWAY_CONTAINER_PORT:-8100}:8000"
      - "${GATEWAY_METRICS_PORT:-9102}:9102"
    # The runtime image is distroless — no shell, no curl, no nc — so a compose
    # healthcheck is impossible. /healthz on the metrics port is published, so
    # probe from the host (CD does exactly that) or use a k8s httpGet probe.

  # C# (.NET 10 NativeAOT) game server. The Go gameserver module was removed;
  # this is the only game server.
  #
  # Service name stays `gameserver-dotnet` because monitoring/prometheus.yaml
  # scrapes it by service DNS name; the container is named rpg-gameserver.
  gameserver-dotnet:
    profiles: ["realtime"]
    image: ${GAMESERVER_IMAGE:-rpg-mmo/gameserver-dotnet:dev}
    container_name: ${COMPOSE_NAME_PREFIX:-rpg}-gameserver
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres-game:
        condition: service_healthy
    # NOTE: configuration is done through the environment below, not through
    # args. (A previous version of this comment claimed the C# arg parser only
    # matches space-separated flags — it does not: GameServer/Program.cs GetArg
    # handles `--addr :9000` and `--addr=:9000` alike. The env block is used
    # because one configuration channel is easier to read than two, and because
    # agones/fleet-map-dotnet-dev.yaml uses the same one.)
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      # Verifies join tokens signed by the gateway. Same value as the gateway
      # service above, and NOT JWT_SECRET (see the comment there).
      JOIN_TOKEN_SECRET: ${JOIN_TOKEN_SECRET:-dev-join-secret-change-me}
      GAMESERVER_ADDR: ":9000"
      # PINNED OFF ON PURPOSE — this is a decision, not an oversight.
      #
      # A stock game server defaults to `require`: it encrypts the gameplay hop
      # and refuses every client that cannot seal. This stack does NOT inherit
      # that default yet, because six Unity sample scenes in the client repo
      # (DOTSNetworkBridge, the three E2ECertification scenes, ReconnectPolicyDemo
      # and WorldView) construct NetworkSettings and dial a live backend, and none
      # of them sets RequireSealedSession. Those scenes are the package's
      # acceptance path, not demos — inheriting the default here would break all
      # six with a refusal, and the fix lives in the other repo on a package
      # release cadence (netcode change -> tag -> manifest + lock bump).
      #
      # To run this stack sealed on purpose — which you should, before shipping
      # anything that depends on it:
      #
      #   GAMESERVER_SEALED=require ./stack.sh up
      #   GAMESERVER_SEALED=require ./stack.sh check
      #
      # NOTE on verifying a sealed stack: the smoke test defaults to JSON, and a
      # JSON client can never carry a sealed frame, so a `require` server refuses
      # it at the join with `encoding_cannot_seal` -- measured live, not inferred.
      # It CAN seal, over protobuf, and `stack.sh check` derives BOTH halves for
      # you when the stack is sealed:
      #   GAMESERVER_SEALED=require ./stack.sh check     (or: make flow-check-sealed)
      #
      # That is also why no ENVIRONMENT can be set to `require` yet: the deploy
      # verifier is the same JSON smoke test, so requiring encryption currently
      # deprecates the thing that gates every deploy.
      GAMESERVER_SEALED: ${GAMESERVER_SEALED:-off}
      GAMESERVER_MODE: map
      GAMESERVER_MAP_ID: ${GAMESERVER_MAP_ID:-map_01}
      GAMESERVER_ID: ${GAMESERVER_ID:-gs-dotnet-${GAMESERVER_MAP_ID:-map_01}}
      # Multi-rate simulation. SIM_CRITICAL_HZ is the BASE tick rate; the other
      # two must divide it exactly and must not exceed it, or the server exits
      # with code 2 at startup rather than rounding. Snapshots are broadcast at
      # the WORLD rate, not the base rate — raising SIM_WORLD_HZ raises outbound
      # bandwidth per client proportionally. See
      # backend/gameserver-dotnet/docs/README.md and docs/DESIGN.md.
      SIM_CRITICAL_HZ: ${SIM_CRITICAL_HZ:-60}
      SIM_WORLD_HZ: ${SIM_WORLD_HZ:-15}
      SIM_BACKGROUND_HZ: ${SIM_BACKGROUND_HZ:-5}
      # /metrics + /healthz. Binds the wildcard, so it answers on any Host —
      # scraped in-network as gameserver-dotnet:9101 and from the host as
      # 127.0.0.1:9101, with no `Host:` header trickery on either path.
      METRICS_ADDR: ${GAMESERVER_METRICS_ADDR:-:9101}
      # The C# server now registers ITSELF here and heartbeats every 5s (TTL 15s),
      # so there is no external registration step any more. Unset REDIS_ADDR and the
      # server runs unregistered — the gateway then answers MsgEnterWorld with
      # "no available server for map <id>".
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # ADVERTISED TO CLIENTS, and it is NOT the listen address. The container
      # listens on :9000 but is published on GAMESERVER_CONTAINER_PORT, and the
      # gateway hands this value back verbatim in MsgEnterWorldResp.ServerAddr —
      # so it MUST BE DIALABLE BY THE CLIENT. That is the contract stated on
      # `publicAddr` in GameServer/Program.cs; the game server warns at startup
      # when this value has no host part.
      #
      # In a container with a published port that means HOST-QUALIFIED:
      # <host>:<published-port> — 127.0.0.1:9200 for a local stack,
      # <public-host>:<published-port> on a VPS. A bare ":9200" is NOT correct
      # here: clients receive it verbatim and cannot dial it (a C# TcpClient
      # throws; only clients that rewrite it to loopback themselves connect).
      # A bare ":port" is correct ONLY for host-mode deploys, where the listen
      # address already is the address clients reach.
      #
      # NOTE: the default below is hostless, so it is only right for host mode.
      # Set GAMESERVER_PUBLIC_ADDR explicitly whenever ports are published.
      GAMESERVER_PUBLIC_ADDR: ${GAMESERVER_PUBLIC_ADDR:-:${GAMESERVER_CONTAINER_PORT:-9200}}
      NAKAMA_URL: http://nakama:7350
      NAKAMA_HTTP_KEY: ${NAKAMA_HTTP_KEY:-defaulthttpkey}
      GAME_DB_URL: postgres://${POSTGRES_GAME_USER:-game}:${POSTGRES_GAME_PASSWORD:-localdev}@postgres-game:5432/${POSTGRES_GAME_DB:-gamestate}?sslmode=disable
    ports:
      - "${GAMESERVER_CONTAINER_PORT:-9200}:9000"
      - "${GAMESERVER_METRICS_PORT:-9101}:9101"

  # ----------------------------------------------------------- monitoring
  # Profile-gated dev observability: `docker compose --profile monitoring up -d`.
  #
  # ONE container (grafana/otel-lgtm) bundles Grafana + Prometheus + Loki +
  # Tempo + Pyroscope + an OTel Collector. It replaces a hand-rolled
  # Prometheus+Grafana pair: fewer moving parts, and OTLP (4317/4318) is already
  # there for when we add traces/logs. See docs/MONITORING.md.
  #
  # Scraping: the image reads /otel-lgtm/prometheus.yaml, so ours is mounted
  # over it (monitoring/prometheus.yaml). Host-run gateway/gameserver are
  # scraped via host.docker.internal (extra_hosts makes that work on Linux too).
  lgtm:
    profiles: ["monitoring"]
    image: grafana/otel-lgtm:${OTEL_LGTM_VERSION:-0.11.15}
    container_name: ${COMPOSE_NAME_PREFIX:-rpg}-lgtm
    restart: unless-stopped
    environment:
      # Grafana admin login. The otel-lgtm image runs a stock Grafana, so the
      # standard GF_SECURITY_* env vars apply. CD writes GRAFANA_ADMIN_PASSWORD
      # into deploy/.env from the environment secret of the same name.
      #
      # CAVEAT (Grafana, not us): the password is only applied when Grafana
      # CREATES the admin user, i.e. on an empty grafana.db. Changing the secret
      # does NOT re-key an existing lgtm-data volume — see docs/MONITORING.md
      # §Deploying to a VPS for the rotation procedure.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-localdev}
      # The image's run-grafana.sh turns on ANONYMOUS ACCESS WITH ORG ROLE
      # "Admin" whenever GF_AUTH_ANONYMOUS_ENABLED is unset — convenient on a
      # laptop, an unauthenticated admin console on a VPS. Always set it
      # explicitly; opt back in per environment with GRAFANA_ANONYMOUS=true.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
    # Bind addresses are parameterised for VPS deploys: Grafana defaults to
    # 0.0.0.0 (put it behind a firewall rule / reverse proxy — see
    # docs/MONITORING.md §Deploying to a VPS), while the OTLP ingest and the
    # bundled Prometheus default to loopback since nothing off-box talks to
    # them yet. Set *_BIND in deploy/.env (CD: environment `vars`) to change.
    ports:
      - "${GRAFANA_BIND:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"        # Grafana UI
      - "${OTLP_BIND:-127.0.0.1}:${OTLP_GRPC_PORT:-4317}:4317"       # OTLP gRPC (traces/metrics/logs)
      - "${OTLP_BIND:-127.0.0.1}:${OTLP_HTTP_PORT:-4318}:4318"       # OTLP HTTP
      - "${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090" # bundled Prometheus (targets/query)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./monitoring/grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/rpg-dashboards.yaml:ro
      - ./monitoring/dashboards:/otel-lgtm/dashboards-rpg:ro
      # All bundled components write under /data — one volume keeps dashboards,
      # TSDB and Loki chunks across restarts.
      - lgtm-data:/data
    healthcheck:
      # The image ships curl but no wget.
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
  postgres-game-data:
  redis-data:
  lgtm-data:
