# The collector's identity. Everything it may do is the Role + RoleBinding pairs
# in 20-rbac.yaml, in the collected namespaces. It has no ClusterRole and no
# binding outside those namespaces.
#
# The API token is mounted (Alloy needs it to list pods and read their logs).
# That is the only credential in the pod: no Secret is referenced anywhere in
# this directory.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rpg-log-collector
  namespace: rpg-k8s-logging
  labels:
    app.kubernetes.io/part-of: rpg-mmo
    app.kubernetes.io/name: alloy
automountServiceAccountToken: true
