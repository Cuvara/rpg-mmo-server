# TEMPLATE. Placeholder values only — never commit real ones.
#
# Apply a filled copy that is NOT in git:
#   cp 30-secret-template.yaml /tmp/rpg-app.secret.yaml
#   $EDITOR /tmp/rpg-app.secret.yaml
#   kubectl --context k3d-rpg-dev apply -f /tmp/rpg-app.secret.yaml
# or generate it without a file at all:
#   kubectl -n rpg-k8s-realtime create secret generic rpg-app-secrets \
#     --from-literal=jwt-secret="$JWT_SECRET" \
#     --from-literal=join-token-secret="$JOIN_TOKEN_SECRET" \
#     --from-literal=redis-password="$REDIS_PASSWORD" \
#     --from-literal=game-db-url="$GAME_DB_URL"
#
# The repo .gitignore covers `.env` but has no rule for Kubernetes secret
# files; ./.gitignore in this directory adds one (`*.secret.yaml`,
# `secret.generated.yaml`) so the obvious filenames cannot be committed by
# accident. Check it before inventing a fifth naming convention.
#
# ONE Secret for both workloads, and the split inside it is the point:
#
#   JWT_SECRET        signs/verifies the CLIENT's Nakama-issued auth token.
#                     The gateway needs it. THE GAME SERVER ALSO CARRIES IT
#                     (the dev fleet does) — see the fleet manifest.
#   JOIN_TOKEN_SECRET signs the gateway->gameserver join token (`sid`-pinned,
#                     single-use, 30s). BOTH sides must hold the IDENTICAL
#                     value or every join fails signature verification.
#
# They are DIFFERENT VALUES on purpose (ADR-8). join-token-secret is on every
# game-server pod, which is the most exposed surface in the tier; if it were
# the same string as jwt-secret, a compromised pod could forge client auth
# tokens for any account. Two secrets means a compromised pod can forge join
# tokens for servers it already is, and nothing else.
apiVersion: v1
kind: Secret
metadata:
  name: rpg-app-secrets
  namespace: rpg-k8s-realtime
  labels:
    app.kubernetes.io/part-of: rpg-mmo
type: Opaque
stringData:
  jwt-secret: "REPLACE_ME_jwt"
  join-token-secret: "REPLACE_ME_join_DIFFERENT_FROM_JWT"
  # Empty is valid: a Redis with no requirepass. Consumed with
  # `optional: true` on both sides so an unset password is not a config error.
  redis-password: ""
  # PostgreSQL DSN for the game state DB, password included — which is why it
  # lives here and never in the ConfigMap. Blank/absent means the in-memory
  # player store and state lost on every pod replacement; under a Fleet that
  # is any rollout, eviction or health kill. A configured-but-unreachable DSN
  # does NOT degrade silently: the server logs "postgres player store
  # unavailable -- refusing to start" and exits 1.
  #   k8s data tier: postgres://game:<pw>@postgres-game.rpg-k8s-data.svc.cluster.local:5432/gamestate
  game-db-url: ""
  # Unused while the fleet is TCP (the server WARNS if it is set under TCP,
  # because it is then ignored). Carried so that turning KCP on is a manifest
  # change, not a new secret-distribution problem found at the wrong moment.
  transport-key: ""
