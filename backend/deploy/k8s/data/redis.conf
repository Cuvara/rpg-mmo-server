# Mirrors the `redis-server` flags in deploy/docker-compose.yml. Keep the two in
# step — a divergence between the compose dev stack and the cluster is a class
# of bug that only shows up in the environment you did not test.

# AOF on: session/registry keys survive a restart.
appendonly yes
appendfsync everysec

# RDB snapshot as a second line of defence.
save 60 1000

# LOAD-BEARING — see ADR-4 and the header of redis.yaml. Do not change this to
# an eviction policy.
maxmemory-policy noeviction

# The ceiling that makes `noeviction` safe rather than merely strict (#202).
#
# `noeviction` with NO `maxmemory` is the worst of both worlds: nothing is ever
# evicted, nothing bounds growth, and the container limit below is enforced by
# the kernel — which kills Redis *whole*, losing sessions, the server registry
# and the stream together. That is precisely the outcome ADR-4 picked
# `noeviction` to avoid, reached by a route the ADR did not close. With a
# `maxmemory` under the container limit, Redis instead stays alive, keeps
# serving reads, and refuses writes with
# `OOM command not allowed when used memory > 'maxmemory'`.
#
# 128mb against the pod's `limits.memory: 256Mi` (redis.yaml). `maxmemory`
# governs the DATASET (`used_memory`), while the cgroup limit governs RSS, so
# the gap has to absorb everything that sits between the two:
#
#   128Mi dataset
#   x1.3   jemalloc fragmentation at a steady state          -> ~166Mi
#   +10Mi  process baseline, client and replication buffers  -> ~176Mi
#   +~38Mi copy-on-write during a BGSAVE / AOF rewrite fork  -> ~214Mi
#   = ~42Mi (16%) of headroom left under the 256Mi limit
#
# The fork term is why this is 50% of the limit and not 80%: `appendonly yes`
# plus `save 60 1000` above means Redis forks, and a fork's COW cost is
# unbounded by anything in this file. 50% is the standard figure for a Redis
# with persistence enabled, and the arithmetic above is why it is standard.
#
# WHEN YOU SEE THE OOM ERROR: it is a capacity signal, not a bug, and not
# something to silence by raising this number alone. Read `INFO memory`
# (`used_memory`, `mem_fragmentation_ratio`) and `XLEN events:game` first. A
# stream at its MAXLEN bound (shared/storage/redisstore.DefaultStreamMaxLen,
# ~7MiB) is not the cause; sessions or registry growth is, and the fix is a
# bigger pod limit AND this value, moved together at the same 50% ratio.
maxmemory 128mb

# No `requirepass`: matches backend/shared/config's default REDIS_PASSWORD="".
# Adding auth means adding the flag here from a Secret AND adding
# `-a $REDIS_PASSWORD --no-auth-warning` to both probes in redis.yaml, or the
# probes fail closed and the pod never becomes Ready.
