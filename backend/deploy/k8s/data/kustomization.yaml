apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Retargeting the whole tier is this one line — but see namespace.yaml and
# README.md §Namespaces before changing it.
namespace: rpg-k8s-data

# includeSelectors:false — these are descriptive labels. Folding them into the
# StatefulSet selectors would make the selectors depend on this block, and a
# StatefulSet selector is immutable after creation.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: rpg-mmo
      rpg-mmo/tier: data

resources:
  - namespace.yaml
  - postgres-meta.yaml
  - postgres-game.yaml
  - redis.yaml
  - nakama.yaml
# secrets.example.yaml is deliberately NOT a resource any more.
#
# It was one, with a note saying to replace it "for anything that is not a
# laptop". The trouble is what applying it DOES: kustomize owns the object, so
# every `apply -k data/` overwrote whatever secrets the namespace already held,
# including ones an operator had just created. Two silent consequences:
#
#   * dev ran on the literal placeholder `dev-secret-change-me` from the day the
#     cluster was built. Nothing failed, because the app tier's rpg-app-secrets
#     had been filled with the same placeholder, so both halves agreed.
#   * staging, given a generated jwt-secret, failed verification with
#     "local jwt verify: invalid signature". rpg-app-secrets kept the generated
#     value -- it is applied out-of-band and never overwritten -- while this
#     reset nakama's to the placeholder. Nothing in the deploy log says so; it
#     reports "applied".
#
# The app tier already had this right: 30-secret-template.yaml is not applied and
# dev-up.sh refuses to continue if rpg-app-secrets is absent. The data tier now
# follows the same contract, and dev-up.sh guards these three the same way AND
# asserts nakama's JWT_SECRET equals rpg-app-secrets' jwt-secret.

configMapGenerator:
  - name: redis-config
    files:
      - redis.conf

# NOT generated here: `gamestate-initdb`. Its content is
# deploy/db/init-gamestate.sql, which lives outside this directory, and
# kustomize refuses file sources above the kustomization root:
#   security; file '.../db/init-gamestate.sql' is not in or below '.../k8s/data'
# Copying the SQL in would create a THIRD copy of a schema that two tests
# already pin to two existing copies, so apply.sh generates the ConfigMap from
# the original file instead. Run apply.sh, not `kubectl apply -k`, for a first
# boot. See README.md §The initdb ConfigMap.
