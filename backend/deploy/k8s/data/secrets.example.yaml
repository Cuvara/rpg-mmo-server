#
#   cp secrets.example.yaml secret-dev.local.yaml   # matches deploy/.gitignore
#                                                   # rule `agones/secret-*.local.yaml`;
#                                                   # see README.md §Secrets for the
#                                                   # k8s/data ignore rule added with it.
#
# The values below are the SAME PUBLISHED DEV PLACEHOLDERS that
# docker-compose.yml defaults to (`localdev`, `dev-secret-change-me`, …). They
# are committed for exactly one reason: a bring-up on a laptop should not need a
# secret-management story. They are not secrets and must never reach a VPS.
#
# stringData is used so the file stays readable; the API server base64-encodes it.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-meta
type: Opaque
stringData:
  POSTGRES_DB: nakama
  POSTGRES_USER: nakama
  POSTGRES_PASSWORD: localdev
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-game
type: Opaque
stringData:
  POSTGRES_DB: gamestate
  POSTGRES_USER: game
  POSTGRES_PASSWORD: localdev
---
apiVersion: v1
kind: Secret
metadata:
  name: nakama
type: Opaque
stringData:
  # MUST equal the gateway's and game server's JWT_SECRET
  # (backend/shared/config, env JWT_SECRET). Nakama signs client session tokens
  # with session.encryption_key = this value, which is what lets the gateway
  # verify a client token locally with no Nakama roundtrip (ADR-3).
  JWT_SECRET: dev-secret-change-me
  NAKAMA_CONSOLE_USER: admin
  NAKAMA_CONSOLE_PASSWORD: password
  NAKAMA_SERVER_KEY: defaultkey
  # The game server calls Nakama's runtime HTTP RPCs with this key
  # (NAKAMA_HTTP_KEY in docker-compose.yml).
  NAKAMA_HTTP_KEY: defaulthttpkey
