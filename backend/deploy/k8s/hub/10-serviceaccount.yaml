# The Studio hub's identity. Everything it may do is the Role + RoleBinding pairs
# in 20-rbac.yaml (rpg-k8s-realtime, rpg-k8s-data, and every
# rpg-k8s-realtime-<game> namespace that render.py renders). There is NO
# ClusterRole and NO ClusterRoleBinding for it in this directory: the only
# cluster-scoped grant is the opt-in optional/node-access.yaml, which dev-up.sh
# never applies.
#
# automountServiceAccountToken is false: no pod runs as this account, and none
# should (nothing runs in this namespace at all). The credential is a token an
# operator mints on demand with `kubectl create token` (docs/RUNBOOK.md); no
# Secret is referenced anywhere in this directory, and no token value is ever
# committed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: studio-hub
  namespace: rpg-k8s-hub
  labels:
    app.kubernetes.io/part-of: rpg-mmo
    app.kubernetes.io/name: studio-hub
automountServiceAccountToken: false
