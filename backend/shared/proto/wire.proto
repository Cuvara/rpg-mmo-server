syntax = "proto3";

// Realtime wire protocol shared by the Go gateway, the C# game server and the
// Unity client.
//
// THIS FILE IS THE SINGLE SOURCE OF TRUTH. Go code under proto/gen/ and C# code
// under gameserver-dotnet/GameServer/Net/Generated/ are both generated from it
// (see proto/generate.sh). Do not hand-edit either one, and do not add a
// parallel definition in another language — the drift that causes is exactly
// what this file exists to prevent.
//
// Framing is NOT described here. Every message travels as
// [4-byte big-endian length][Envelope bytes], identically to the JSON encoding
// it replaces, so the transport layer (TCP/KCP) is unaffected.

package rpgmmo.wire.v1;

option go_package = "github.com/duycuong/rpg-mmo/shared/proto/gen;wirepb";
option csharp_namespace = "RpgMmo.Wire.V1";

// MsgType selects the payload schema carried by an Envelope.
//
// The numeric values are FROZEN — they are the same integers the JSON encoding
// puts in its "type" field, so both encodings share one type space and a
// dual-stack peer routes a message the same way whichever encoding it arrived
// in. Never renumber; only append.
enum MsgType {
  MSG_TYPE_UNSPECIFIED = 0;
  MSG_TYPE_AUTH = 1;             // client -> gateway
  MSG_TYPE_AUTH_RESP = 2;        // gateway -> client
  MSG_TYPE_ENTER_WORLD = 3;      // client -> gateway
  MSG_TYPE_ENTER_WORLD_RESP = 4; // gateway -> client
  MSG_TYPE_JOIN_TOKEN = 5;       // client -> gameserver
  MSG_TYPE_JOIN_TOKEN_RESP = 6;  // gameserver -> client
  MSG_TYPE_INPUT = 7;            // client -> gameserver (per tick)
  MSG_TYPE_SNAPSHOT = 8;         // gameserver -> client (per tick)
  MSG_TYPE_DISCONNECT = 9;       // either direction
  MSG_TYPE_RESYNC = 10;          // client -> gameserver (request a keyframe)
  // 11, 12: reserved
  MSG_TYPE_TRANSFER_MAP = 13;    // client -> gameserver (request map transfer)
  MSG_TYPE_TRANSFER_MAP_RESP = 14; // gameserver -> client (transfer result)
  MSG_TYPE_PING = 11;            // either direction (heartbeat)
  MSG_TYPE_PONG = 12;            // either direction (heartbeat reply)
  // 13 and 14 are reserved for MsgTransferMap/Resp.
  MSG_TYPE_KICK = 15;            // server -> client (forced disconnect with reason)

  // Sealed-session handshake on the GAMEPLAY hop only. See
  // backend/docs/SEALED-FRAMING.md.
  //
  // 16 and 17 rather than the next free small numbers for a reason worth
  // stating: both stay inside the one-byte varint range (<= 127), so the
  // envelope tag cost does not change, and leaving 18-31 clear keeps a
  // contiguous block for the gateway hop's own handshake when ADR-22 settles
  // it. Recycling a number is how two versions silently disagree about what a
  // byte means, which is why field 5 of EnterWorldResponse is reserved rather
  // than reused.
  MSG_TYPE_SEALED_CLIENT_HELLO = 16; // client -> gameserver
  MSG_TYPE_SEALED_SERVER_HELLO = 17; // gameserver -> client
}

// Envelope is the top-level wire message.
//
// `type` is field 1 and is always >= 1 for any real message, so proto3 never
// elides it and an encoded Envelope ALWAYS begins with tag byte 0x08. A JSON
// envelope always begins with '{' (0x7B). Those cannot collide, which is what
// lets a peer identify the ENCODING from the first body byte alone — no
// encoding negotiation and no extra handshake round trip. See docs/DESIGN.md.
//
// That sniffing answers "how are these bytes framed", NOT "do the two sides
// agree on what the fields mean". The latter is `protocol_version`, carried on
// the two handshake requests (AuthRequest, JoinTokenRequest) and echoed on their
// responses. It costs nothing per message — deliberately NOT a field here,
// because an Envelope field is paid on every snapshot of every tick forever to
// re-state a number that cannot change within a connection.
//
// `payload` stays opaque bytes rather than becoming a oneof so that routing and
// payload decoding remain separable, exactly as in the JSON encoding: a proxy or
// relay can dispatch on `type` without linking in every payload schema.
message Envelope {
  uint32 type = 1;
  bytes payload = 2;
}

// --- Protocol version ---
//
// THE CONTRACT. `protocol_version` is a single monotonically increasing integer
// naming the SEMANTICS of this schema — not its shape, and not the encoding.
// Shape is already self-describing (proto3 skips unknown fields) and encoding is
// already sniffed from byte 0. What neither of those catches is two peers that
// parse every byte successfully and disagree about what a field MEANS. That is
// the failure this number exists to make loud: it compiles, it connects, and the
// numbers are consistent about the wrong thing.
//
// The current version is defined ONCE, in Go, at
// `shared/messages.WireProtocolVersion`; C# mirrors it in
// `GameServer/Net/WireProtocol.cs` and the Unity client in
// `Runtime/Protocol/WireProtocolVersion.cs`. All three are asserted equal by
// test on their own side; there is no way to make one file authoritative across
// three languages, so each pins the constant and a golden vector ties them.
//
// WHEN TO BUMP IT. Bump for any change that would let a conforming peer of the
// previous version misinterpret a conforming peer of the new one:
//
//   1. Reusing or renumbering a field number, or removing a field that a
//      receiver acts on.
//   2. Changing the MEANING, units, range or reference frame of an existing
//      field (e.g. speed switching from units/second to units/tick). This is the
//      dangerous class: the bytes stay identical and only the interpretation
//      moves, so nothing anywhere errors.
//   3. Changing the snapshot state machine — handle lifecycle, keyframe reset
//      points, the delta "what counts as changed" rule, or the normative merge
//      algorithm in gameserver-dotnet/docs/API.md.
//   4. Adding a message or field that a receiver MUST act on to stay correct —
//      i.e. one where ignoring it silently diverges rather than degrades.
//
// DO NOT bump for a purely additive optional field whose absence is covered by a
// documented "zero means not sent" rule and whose omission degrades visibly
// rather than diverging silently. An old peer ignoring it is then a supported
// configuration, which is the whole point of writing that rule down. `facing`
// and `action` (EntitySnapshot, version 1) are exactly this case and did NOT
// bump the number — a rule that fired on every change would be a build counter,
// not a compatibility contract.
//
// ZERO MEANS "NOT SENT", AND IS NOT REFUSED BY DEFAULT. proto3 elides a zero
// uint32, so a peer predating this field is indistinguishable on the wire from
// one sending 0 — the same trap documented at length on EntitySnapshot.speed.
// Version numbering therefore starts at 1, never 0, and 0 is reserved to mean
// "this peer does not advertise a version".
//
// A receiver ADMITS an unversioned peer by default and counts it
// (`*_unversioned_handshakes_total`), because on the day this field ships every
// client in existence sends 0 and refusing them all is a flag day that closes a
// hypothetical by breaking everything real. The admission is a configured
// default, not a property of the protocol: set the gateway's
// `--min-protocol-version` or the game server's `GAMESERVER_MIN_PROTOCOL_VERSION`
// to 1 once the fleet advertises, and an unversioned peer is refused through the
// same named path as a mismatched one. That flip is the migration, and until it
// happens the counter is what tells you whether it is safe.
//
// WHO REFUSES AND HOW. The server side of each hop refuses, never the client,
// and it refuses with a NAMED REASON rather than a parse failure or a silent
// close: `protocol_version_mismatch`, in the `error` field of AuthResponse or
// JoinTokenResponse, matching the existing reason-string convention
// (`server_shutdown`, `session_expired`, `rate_limited`). Both hops check
// independently — passing the gateway does NOT vouch for the client at the game
// server, because under ADR-3 the gateway is a redirector that never sees a
// snapshot, and a client can hold a valid join token while disagreeing with the
// game server about the schema the join token gives it access to.
//
// The responses ECHO the server's own version. That is the only way a NEW client
// detects an OLD server: an old server does not know the field, ignores it, and
// replies without one, so a client that sees 0 coming back knows it is talking
// to a peer that never checked. Nothing else on the wire reveals that.

// --- Gateway handshake ---

// AuthRequest is sent by the client to authenticate with the gateway.
message AuthRequest {
  string token = 1;

  // Wire protocol version this client implements. See "Protocol version" above.
  // Zero means "not advertised" (a client predating the field), which is
  // admitted or refused according to the gateway's --min-protocol-version.
  uint32 protocol_version = 2;
}

// AuthResponse is the gateway's reply to an auth request.
message AuthResponse {
  bool ok = 1;
  string user_id = 2;
  string error = 3;

  // The gateway's own wire protocol version, echoed so a new client can detect
  // an OLD gateway: a gateway predating this field replies with 0 here, and 0 is
  // the client's only signal that its version was never checked. Sent on
  // rejection too — unlike tick_rate, this is not privileged tuning, and a
  // client refused for a version mismatch needs to know which version to be.
  uint32 protocol_version = 4;
}

// EnterWorldRequest asks the gateway to assign a game server.
//
// `party_id` selects between the two things this one message can ask for, and
// ADR-26 decision 1 is the reason there is only one message:
//
//   empty     -> a MAP server for `map_id`, the flow that has always existed.
//   non-empty -> a DUNGEON INSTANCE of the content named by `map_id`, for this
//                party. The first member's request allocates a pod; every later
//                member is handed the SAME address, because the instance is
//                keyed by the party and not by the content (ADR-26 decision 2).
//
// The gateway verifies the caller really is a member of the named party against
// Nakama, once per entry (ADR-26 decision 3). A client that names a party it is
// not in is refused; it is not quietly given a map.
message EnterWorldRequest {
  string map_id = 1;
  string party_id = 2;
}

// EnterWorldResponse contains the game server address and join token.
//
// `transport` tells the client which realtime transport the target game server
// speaks ("tcp" or "kcp"). Empty means "tcp".
message EnterWorldResponse {
  string server_addr = 1;
  string join_token = 2;
  string transport = 3;
  string error = 4;

  // RESERVED. Field 5 briefly carried a per-session key derived from
  // JOIN_TOKEN_SECRET and the join token's jti. ADR-22 supersedes that scheme
  // with an authenticated X25519 exchange on the gameplay hop, which gives
  // forward secrecy the derivation could not: a derived key is a pure function
  // of a long-lived secret and a jti that travels in the clear, so anyone who
  // later obtains that secret can decrypt every recorded past session.
  //
  // The number is RESERVED rather than reused. A peer built against the old
  // schema would read whatever now occupies field 5 as 32 bytes of key material
  // and would fail in a way that looks like a key mismatch rather than a schema
  // mismatch — which is the most expensive kind of wrong answer this protocol
  // can give. Reserving it makes that impossible at compile time.
  reserved 5;
  reserved "session_key";

  // The game server's Ed25519 IDENTITY public key, 32 bytes (ADR-25).
  //
  // Generated by the pod at startup, never persisted, never configured; it
  // reaches this message by travelling pod -> Redis registry entry -> gateway.
  // It is the key that verifies `SealedServerHello.server_signature` on the
  // gameplay hop, and it is a NEW field number because field 5 is reserved
  // forever -- see above for why that reservation is not negotiable.
  //
  // WHAT A CLIENT MAY CONCLUDE FROM IT, WHICH IS LESS THAN IT LOOKS. This
  // message crosses the GATEWAY hop, which is plaintext in every environment
  // today (ADR-23's TLS is implemented and defaults off). An attacker able to
  // man-in-the-middle the gameplay hop is on the same network path as this hop,
  // so he substitutes this key and then forges a signature that verifies
  // against it. Checking the signature therefore proves the gameplay peer holds
  // the key NAMED HERE -- nothing more -- and that is only an identity claim
  // when this message itself arrived authenticated.
  //
  // So a client MUST report two different things: that it checked the
  // signature, and whether the hop that delivered this key was authenticated.
  // Only the conjunction is `server_identity_verified` (ADR-25 decision 6). An
  // instrument that reports the strong claim on the weak evidence is worse than
  // no instrument.
  //
  // Empty means the gateway has no key for that server -- an older game server,
  // or a registry entry written before this field existed. A client that
  // REQUIRES identity must refuse the join rather than continue unverified:
  // there is no negotiation and no fallback (ADR-22 decision 3).
  bytes server_public_key = 6;
}

// --- Game server handshake ---

// JoinTokenRequest is sent by the client to authenticate with a game server.
message JoinTokenRequest {
  string token = 1;

  // Wire protocol version this client implements. See "Protocol version" above.
  //
  // Checked here INDEPENDENTLY of the gateway's check on AuthRequest, and that
  // duplication is deliberate rather than redundant. Under ADR-3 these are two
  // separate connections to two separate processes: the gateway is a redirector
  // that hands back {ServerAddr, JoinToken} and never carries a snapshot, so it
  // cannot vouch for a client's ability to read one. The gateway and the game
  // server are also deployed and upgraded independently, so "the gateway
  // accepted it" says nothing about the schema the game server encodes with —
  // and it is the game server, not the gateway, that a version disagreement
  // actually corrupts, because the snapshot stream is where a misparse turns
  // into a wrong world.
  uint32 protocol_version = 2;
}

// JoinTokenResponse confirms whether the join was accepted.
message JoinTokenResponse {
  bool ok = 1;
  string user_id = 2;
  string error = 3;
  // The CRITICAL simulation rate in Hz — the rate the client must predict at.
  // Session-constant: the server reads it once at startup and never changes it,
  // which is why it rides the join response and not every snapshot.
  //
  // 0 means "not supplied" (a pre-0.x server that predates this field). A client
  // that sees 0 must REFUSE to predict rather than assume 15: assuming is exactly
  // the silent desync this field closes (#93).
  uint32 tick_rate = 4;

  // The game server's own wire protocol version, echoed so a new client can
  // detect an OLD game server. See "Protocol version" above.
  //
  // Unlike `tick_rate`, this IS sent on a rejected join (`ok = false`). A
  // rejected client is told nothing about the server's tuning because it has not
  // proved it is entitled to it — but a client refused for a version mismatch
  // has to be told which version it failed against, or the refusal is as opaque
  // as the parse error it replaces and the operator learns nothing from it.
  uint32 protocol_version = 5;
}

// --- Gameplay ---

// InputMessage carries player input for one tick.
message InputMessage {
  uint64 tick = 1;
  float move_x = 2;
  float move_y = 3;
  string attack_target_id = 4;

  // --- Ability input (gameplay v2) ---

  // Content id of the ability the player is trying to use this tick, as defined
  // in the content set served at /content (ADR-19). ZERO MEANS "NO ABILITY",
  // which is why ability ids are allocated from 1 in the content validator: a
  // proto3 zero is elided, so id 0 and "this client sent no ability" would be
  // the same bytes and the server could not tell a missing field from a real
  // ability.
  //
  // This is a REQUEST, not a result. The server validates it against the
  // content set, the caster's state and its cooldown, and the only thing the
  // client learns about the outcome is what comes back in the snapshot: a
  // GAME_EVENT_TYPE_ABILITY_CAST event if it resolved, nothing if it did not.
  // There is deliberately no per-input acknowledgement — an input that failed
  // is already described by the world not changing, and a rejection channel
  // would be a second, contradictable account of the same fact.
  //
  // Abilities are NOT client-predicted. Prediction covers movement only
  // (Documentation~/PREDICTION.md): movement is a pure function of input the
  // client already has, while an ability outcome depends on cooldowns, content
  // and other entities' state that the client can only guess at. A mispredicted
  // ability is visible as a cast that plays and then un-happens, which is worse
  // than a cast that starts one round trip late.
  uint32 ability_id = 5;

  // Target entity for a targeted ability, empty for self- and ground-targeted
  // ones. Same id space as `attack_target_id` — the server-side entity id, not
  // a handle, because input travels client -> server and the interning table is
  // built by the SERVER for its own outbound snapshots. A client has no handle
  // to send that the server would recognise.
  string ability_target_id = 6;

  // Aim point in world coordinates for a ground-targeted ability. Ignored for
  // self- and entity-targeted ones.
  //
  // Sent as a plain pair of floats rather than being folded into move_x/move_y:
  // they are different quantities (a POINT in world space against a DIRECTION),
  // and an input that both moves and aims elsewhere is ordinary — a player
  // strafing while dropping an area effect behind them.
  //
  // Zero is a legitimate aim point (world origin), so a receiver must not read
  // (0,0) as "not aimed". `ability_id` is what says whether any of this is
  // meaningful: aim fields are only read when it is non-zero.
  float aim_x = 7;
  float aim_y = 8;
}

// EntityType enumerates the entity kinds the simulation knows about.
//
// Numbers are FROZEN once shipped. Append only; never renumber.
//
// A string entity type cost 8 bytes on the wire ("player" = tag + length + 6
// characters); the enum costs 2. Measured against a 50-entity keyframe that is
// ~19% of the whole payload, which is why this exists.
enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  ENTITY_TYPE_PLAYER = 1;
  ENTITY_TYPE_MOB = 2;
  // Not yet produced by the simulation, but named here so that adding one is an
  // append rather than a renumber. A server that starts emitting these against
  // an older client degrades to `type_name` rather than breaking.
  ENTITY_TYPE_NPC = 3;
  ENTITY_TYPE_ITEM = 4;
  ENTITY_TYPE_PROJECTILE = 5;
}

// EntityAction is a coarse, level-triggered description of what an entity is
// doing right now, for a renderer to pick an animation from.
//
// Numbers are FROZEN once shipped. Append only; never renumber.
//
// ZERO IS RESERVED and means "not sent" — a sender that predates this field, or
// one that has nothing to say. IDLE is deliberately 1, NOT 0: proto3 elides a
// zero enum, so making idle the zero value would make "this entity is standing
// still" and "this server does not know about actions" the same bytes. That is
// the exact ambiguity documented at length on `speed` below, and here it is
// avoidable for free, so it is avoided. `EntityType` already reserves 0 the same
// way (ENTITY_TYPE_UNSPECIFIED means "see type_name"), so this is the file's
// established idiom rather than a new rule.
//
// This is LEVEL-triggered, not edge-triggered: it says what state the entity is
// in, not that a state was entered. A renderer that needs to retrigger the same
// action twice in a row (attack, attack) cannot get that edge from this field
// alone — that needs a sequence number, which is an animation-system concern and
// is deliberately not here. See shared/docs/DESIGN.md, "Entity facing and action
// state on the wire", for what was left out and why.
enum EntityAction {
  ENTITY_ACTION_UNSPECIFIED = 0; // not sent / unknown — never "idle"
  ENTITY_ACTION_IDLE = 1;
  ENTITY_ACTION_MOVING = 2;
  ENTITY_ACTION_ATTACKING = 3;
  ENTITY_ACTION_DEAD = 4;
}

// EntitySnapshot is a single entity's visible state.
//
// This is the hottest message in the protocol: a snapshot carries one per entity
// in the AOI, every tick. Measured marginal cost with a realistic 15-character
// id is ~41 bytes, of which the two strings are ~25 — so string content, not
// field encoding, is what dominates here.
//
// `id` is INTERNED: it is sent once per connection per keyframe interval, to
// introduce a `handle`, and every later mention of that entity carries only the
// handle. A realistic id costs ~17 bytes; a handle costs 1-2.
//
// Unlike the type enum, this is protocol STATE rather than a re-encoding, so
// round-tripping one message proves nothing — the risk lives entirely in the two
// sides disagreeing about what a handle means. See shared/docs/DESIGN.md for the
// lifecycle and the recovery path.
message EntitySnapshot {
  // Entity id. Present ONLY on the message that introduces `handle` to this
  // connection; empty on every later mention of the same entity.
  //
  // A receiver that sees a handle it has no binding for MUST NOT guess. It has
  // lost state the sender assumed it had, and the only correct response is to
  // ask for a keyframe (MsgResync), which resets both sides.
  string id = 1;

  // Type name as a string, used ONLY when `type` cannot express the value —
  // i.e. the simulation produced a kind this schema does not enumerate yet.
  //
  // This is field 2, which previously carried the type for every entity. A peer
  // that reads only this field still works when it is populated, and the two are
  // never both set, so "the type" is unambiguous: prefer `type`, fall back to
  // `type_name`.
  string type_name = 2;

  float x = 3;
  float y = 4;
  int32 hp = 5;
  int32 max_hp = 6;

  // The entity kind. ENTITY_TYPE_UNSPECIFIED means "see type_name".
  EntityType type = 7;

  // Per-connection alias for `id`, valid only until the next keyframe.
  //
  // Handles are allocated from 1 and RESET AT EVERY KEYFRAME, which is what
  // keeps them small enough to be a 1-2 byte varint and, more importantly, what
  // bounds how long a disagreement can persist: a keyframe re-introduces every
  // binding, so any divergence is repaired within one keyframe interval whether
  // or not anyone noticed it.
  //
  // Handles are never reused within an interval. Reuse would mean a receiver
  // that missed a despawn silently attributes an update to the wrong entity —
  // wrong state rather than absent state, which is far harder to detect.
  //
  // Zero means "not interned": the sender is using `id` directly. That keeps the
  // field optional, so a peer that does not implement interning still works.
  uint32 handle = 8;

  // Movement speed in world units per second — the value the server's
  // MovementSystem.Integrate is actually multiplying by, for THIS entity right
  // now, not the spawn default.
  //
  // Exists for client-side prediction. Prediction replays local input through
  // the same Shared.GameLogic movement code the server runs, and that code needs
  // speed; without this field a client can only assume the spawn default. The
  // assumption holds until anything changes a player's speed — a buff, a mount,
  // a slow — and then client and server integrate different distances every
  // tick with NO error on either side. The client corrects on every snapshot, so
  // it presents as rubber-banding, which reads as a network problem and gets
  // debugged as one, in the wrong layer.
  //
  // ZERO MEANS "NOT SENT", NOT "IMMOBILE". proto3 elides a zero float, so a
  // pre-speed server and a genuinely immobile entity are indistinguishable on
  // the wire. A receiver MUST treat `speed <= 0` as "no value" and fall back to
  // its configured default rather than concluding the entity cannot move —
  // trusting it unconditionally means an old server pins every client's
  // predicted speed to zero and the local player stops moving.
  //
  // Sent on every mention of an entity, never interned. Interning it would buy
  // ~5 bytes and inherit the whole handle-lifecycle contract above; speed is a
  // plain value with no identity, and the delta encoder already suppresses
  // entities whose state has not changed at all.
  float speed = 9;

  // Facing direction, as 16-bit BINARY RADIANS BIASED BY ONE.
  //
  //   wire 0                -> NOT SENT: this sender has no facing to report.
  //   wire v in [1, 65536]  -> angle = (v - 1) * 2*PI / 65536 radians,
  //                            counter-clockwise from +X (due east).
  //
  // WHY THE BIAS, AND WHY NOT A FLOAT. `float facing` is the obvious encoding and
  // it is wrong here, because proto3 elides a zero float and 0.0 radians is a
  // perfectly ordinary facing — due east. A server meaning "facing east" and a
  // server predating this field would put IDENTICAL BYTES on the wire, and no
  // receiver rule can separate them.
  //
  // `speed` below has exactly that ambiguity and has to document its way around
  // it, because a speed of zero is genuinely meaningful and float is the natural
  // type. Facing has no such excuse: reserving zero costs one addition on each
  // side and removes the ambiguity BY CONSTRUCTION rather than by asking every
  // implementer to remember a rule. Every representable angle has a non-zero wire
  // value, so an absent field means one thing only.
  //
  // It is also smaller: 1-3 bytes of varint against a float's fixed 5, on the
  // hottest message in the protocol. That is the same class of saving as the
  // entity-type enum (which exists to save 6 bytes per entity) and id interning
  // (~15). Resolution is 360/65536 = 0.0055 degrees, far below anything a player
  // can see.
  //
  // RECEIVER RULE. Zero means "no value" — NOT "facing east". A receiver MUST
  // keep the entity's last known facing, or derive one from its movement, rather
  // than snapping it to east. Trusting a zero unconditionally means every entity
  // from an old server points the same way, which reads as a content bug and gets
  // debugged as one.
  //
  // Sent on every mention of an entity, never interned, for the same reason as
  // `speed`: a receiver that resolves a handle expects complete state.
  uint32 facing_brad = 10;

  // What the entity is doing, for animation selection. See EntityAction above.
  //
  // ENTITY_ACTION_UNSPECIFIED (0) means "not sent", never "idle" — idle is 1.
  // A receiver MUST treat 0 as "no value" and keep whatever it was showing, not
  // fall back to idle: an old server would otherwise freeze every entity in the
  // world into an idle pose, which looks like a broken animator rather than a
  // missing field.
  EntityAction action = 11;

  // Retrigger counter for `action`, incremented by the server every time the
  // entity ENTERS an action, including re-entering the one it is already in.
  //
  // WHY THIS EXISTS. `action` is level-triggered and says so at length above: it
  // reports the state an entity is in, not that a state was entered. Two attacks
  // in a row therefore put identical bytes on the wire for both of them, and a
  // renderer driving an animator from `action` alone plays the attack once and
  // then holds — the second swing never fires. That is not a renderer bug and no
  // amount of client-side edge detection on `action` can fix it, because the
  // edge genuinely is not in the data.
  //
  // The enum's own documentation calls this out and defers it as "an animation
  // system concern". It is not: the server is the only party that knows an
  // action was re-entered, so the edge has to be MANUFACTURED here or it does
  // not exist anywhere. This field is that edge, in one varint.
  //
  // SEMANTICS. A receiver retriggers when the value CHANGES, not when it
  // increases. It is a per-entity counter that wraps at 2^32 and is reset when
  // the server restarts or the entity respawns, so "greater than" is not a safe
  // test and a receiver that uses one stops retriggering for 4 billion actions
  // after a single wrap. Inequality has no such failure mode.
  //
  // ZERO MEANS "NOT SENT". The counter is allocated from 1 for the same reason
  // as every other zero-reserving field in this file: a server that predates
  // this field and an entity whose counter happens to be zero must not look the
  // same. A receiver seeing zero keeps its existing behaviour — drive the
  // animator from `action` alone and accept that repeats do not retrigger —
  // rather than treating it as an edge, which would retrigger every animation on
  // every snapshot from an old server.
  //
  // Sent on every mention of an entity, never interned, for the same reason as
  // `speed` and `facing_brad`: a receiver that resolves a handle expects
  // complete state.
  uint32 action_seq = 12;
}

// --- Game events (gameplay v2) ---

// GameEventType enumerates the EDGE-TRIGGERED things that happen in the world.
//
// Numbers are FROZEN once shipped. Append only; never renumber.
//
// WHY AN EVENT CHANNEL EXISTS AT ALL. Everything else the server sends a client
// is LEVEL-triggered state: where an entity is, how much HP it has, what it is
// doing. That is the right shape for state, and it is the wrong shape for
// occurrences. "This entity took 12 damage" is not recoverable from two HP
// values a tick apart — a heal and a hit in the same tick net out, a delta
// snapshot may not carry the entity at all if it also regenerated back, and an
// entity that leaves the AOI mid-fight simply stops reporting. A client that
// infers damage numbers from HP deltas is wrong in exactly the cases a player
// notices, and it is wrong silently.
//
// ZERO IS RESERVED and means "not sent / unknown", following the same rule as
// EntityType and EntityAction. A receiver MUST ignore an event it does not
// recognise rather than guessing: events are presentation, so dropping an
// unknown one costs a missing damage number, while guessing costs a wrong one.
enum GameEventType {
  GAME_EVENT_TYPE_UNSPECIFIED = 0;

  // `target` took `amount` damage from `source`. `amount` is the damage
  // APPLIED, after mitigation — the number a player expects to see float off a
  // head, not the pre-defense roll.
  GAME_EVENT_TYPE_DAMAGE = 1;

  // `target` was healed `amount` by `source`.
  GAME_EVENT_TYPE_HEAL = 2;

  // `target` died. `source` is the killer, or 0 when nothing killed it (a
  // despawn, a zone, a disconnect).
  //
  // This is NOT redundant with EntityAction.Dead, and the difference is the
  // whole reason the event channel exists: `Dead` is a state that persists for
  // as long as the corpse does, so a client joining afterwards sees Dead and
  // cannot tell whether the death just happened. The event says it happened
  // now, which is what a death animation, a sound and a kill feed all need.
  GAME_EVENT_TYPE_DEATH = 3;

  // `source` successfully cast `ability_id`. Emitted when the cast RESOLVES on
  // the server, which is the only moment both sides agree on.
  GAME_EVENT_TYPE_ABILITY_CAST = 4;

  // `target` gained `amount` experience. Sent only to the entity's own
  // connection — see the visibility note on GameEvent.
  GAME_EVENT_TYPE_XP_GAIN = 5;

  // `target` reached level `amount`.
  GAME_EVENT_TYPE_LEVEL_UP = 6;
}

// GameEvent is one edge-triggered occurrence, addressed to entities by the SAME
// interned handles the surrounding snapshot uses.
//
// WHY THIS RIDES SnapshotMessage RATHER THAN BEING ITS OWN MsgType. Three
// reasons, and the first is the load-bearing one:
//
//  1. HANDLES. Entity ids are interned per connection and the table RESETS AT
//     EVERY KEYFRAME (see EntitySnapshot.handle). An event in a separate
//     message would either have to carry full string ids — ~17 bytes per
//     participant, on the one message class that fires hardest during combat —
//     or resolve handles against a table whose lifetime it does not share,
//     which is a race that produces events attributed to the WRONG ENTITY. A
//     wrong damage number is far worse than a missing one. Riding the snapshot
//     makes the handle table and the events that use it the same message, so
//     they cannot disagree.
//
//  2. TICK. Every event belongs to the tick that produced it. The snapshot
//     already carries that tick, so nesting costs zero bytes to say when an
//     event happened, where a separate message pays a uint64 per batch and
//     still has to be ordered against the snapshot stream by the receiver.
//
//  3. ORDERING. One stream, one order, already reliable. No new connection
//     state, no new MsgType, no second thing to reconnect.
//
// The cost is that events only travel when a snapshot does, which for a
// connection receiving snapshots every tick is not a delay anyone can perceive.
//
// VISIBILITY. Events are filtered per connection exactly like entities are: a
// connection is sent an event only when it can see at least one of the
// participants, and private events (XP, level) only when the receiver IS the
// subject. This is the same AOI rule the entity set already obeys, applied to
// occurrences — an event channel that leaked the whole world would be a
// wallhack shipped as a feature.
message GameEvent {
  GameEventType type = 1;

  // Interned handle of the entity that CAUSED this, or 0 for "none / the
  // world". Resolved against the same table as EntitySnapshot.handle in the
  // snapshot carrying this event.
  //
  // A handle here may name an entity NOT present in this snapshot's `entities`
  // list: a delta only carries entities whose state changed, and the killer of
  // something in your AOI need not have moved. That is legal and expected. It
  // may NOT name an entity the connection has no binding for — a receiver that
  // sees one has lost interning state and must ask for a keyframe, the same
  // recovery path EntitySnapshot.id documents.
  uint32 source = 2;

  // Interned handle of the entity this HAPPENED TO. 0 for events with no
  // subject.
  uint32 target = 3;

  // Magnitude: damage dealt, health restored, experience gained, level reached.
  // Meaning is per `type` and is documented on each value above.
  //
  // SIGNED, and sint32 rather than int32, because the zigzag encoding keeps a
  // small negative cheap. Damage and healing are both reported POSITIVE under
  // their own event types rather than as one signed quantity — a client that
  // colours a number by its sign would show mitigated-to-zero damage and a
  // zero heal identically. The sign is available for the cases that genuinely
  // need it (an absorb, a level lost) without overloading the common ones.
  sint32 amount = 4;

  // Content id of the ability involved, 0 when none. Same id space as
  // InputMessage.ability_id, so a damage event can say which ability dealt it.
  uint32 ability_id = 5;

  // Presentation flags: bit 0 = critical, bit 1 = the target was immune or the
  // effect was fully mitigated, bit 2 = the effect came from a periodic source
  // rather than a direct one.
  //
  // A bitfield rather than more enum values because these COMBINE — a critical
  // periodic tick is one event, not two — and because a receiver that does not
  // understand a bit ignores it and still shows a correct number, where an
  // unrecognised enum value means the whole event is dropped.
  uint32 flags = 6;

  // Full entity ids, used ONLY by a receiver that is not interning — the legacy JSON
  // encoding, which has no handle table and for which `source`/`target` are always
  // zero. Empty on every Protobuf connection.
  //
  // This mirrors EntitySnapshot's own id/handle duality exactly, and for the same
  // reason: the two encodings share one schema, and an encoding without interning
  // still has to be able to name an entity. The alternative considered was to send no
  // events at all on a JSON connection. It was rejected because a silently
  // encoding-dependent feature is the kind of difference that is discovered by a
  // player on the wrong client, not by a test — and because "JSON is legacy" is a
  // reason to keep it simple, not a licence to make it wrong.
  //
  // A receiver prefers the handle when it is non-zero and falls back to these
  // otherwise, which is the same precedence rule EntitySnapshot documents for
  // `type`/`type_name`.
  string source_id = 7;
  string target_id = 8;
}

// SnapshotMessage is a world state update sent to the client.
//
// Either a KEYFRAME (full = true, `entities` is the complete AOI set and the
// client discards anything not listed) or a DELTA (full = false, `entities`
// holds only entities whose visible state changed since the previous snapshot
// sent to this connection and `removed` lists entities that left the AOI or the
// world).
message SnapshotMessage {
  uint64 tick = 1;
  // Highest client input tick the server has accepted for the receiving player;
  // the client's reconciliation anchor. Zero means "no input accepted yet".
  uint64 ack_tick = 2;
  bool full = 3;
  repeated EntitySnapshot entities = 4;
  repeated string removed = 5;

  // Edge-triggered occurrences produced by the tick this snapshot reports, in
  // the order the simulation produced them. Empty on most snapshots.
  //
  // Sent on DELTAS AND KEYFRAMES ALIKE, and never re-sent. A keyframe restates
  // the world's STATE because a client may have missed a delta; it does not
  // restate its HISTORY, because an event that has already been shown must not
  // be shown twice. A client that missed the snapshot carrying an event has
  // missed the event — permanently, by design. Events are presentation, and a
  // damage number arriving late is worse than one that never arrives.
  //
  // See GameEvent for why these live here rather than in a message of their own.
  repeated GameEvent events = 6;
}

// DisconnectMessage is sent by either side to end the session politely.
// The JSON encoding sends an empty object here; the field is reserved for a
// future reason string and is optional in both encodings.
message DisconnectMessage {
  string reason = 1;
}

// ResyncRequest asks the game server to make the next snapshot a full keyframe.
// It carries no fields and encodes to zero bytes.
message ResyncRequest {}

// --- Map transfer ---

// TransferMapRequest is sent by the client to request a map transfer.
// The game server saves state and disconnects; the client then reconnects
// through the gateway to the new map's server via the existing MsgEnterWorld
// flow.
message TransferMapRequest {
  string map_id = 1;
}

// TransferMapResponse is the game server's reply to a transfer request.
message TransferMapResponse {
  bool ok = 1;
  string error = 2;
}

// --- Heartbeat ---

// PingMessage is a heartbeat probe. The sender fills `timestamp` with its own
// monotonic time in milliseconds; the receiver echoes it back in a PongMessage
// so the sender can measure RTT.
message PingMessage {
  int64 timestamp = 1;
}

// PongMessage is the reply to a PingMessage. `timestamp` echoes the sender's
// value unchanged; `server_time` is the responder's wall clock in milliseconds
// since the Unix epoch.
message PongMessage {
  int64 timestamp = 1;
  int64 server_time = 2;
}

// --- Server control ---

// KickMessage is sent server -> client to force a disconnect with a reason.
// Reasons are machine-readable strings (e.g. "duplicate_login",
// "server_shutdown", "session_expired", "rate_limited").
message KickMessage {
  string reason = 1;
}

// --- Sealed-session handshake (gameplay hop) ---
//
// Two messages, both sent IN THE CLEAR, immediately after MsgJoinToken and
// before any sealed frame. There is no key yet, which is what they exist to
// establish. Normative description: backend/docs/SEALED-FRAMING.md §5.
//
// The exchange is X25519, authenticated by a binding that proves possession of
// material derived from JOIN_TOKEN_SECRET. The join token itself proves nothing
// here — its claims are base64 and an eavesdropper simply replays what it read
// — so the binding, not the token, is what defeats a man in the middle.
//
// GAMEPLAY HOP ONLY. The gateway hop needs a different anchor (a pinned gateway
// identity key) because at that point the client holds no join token, and that
// trust model is still ADR-gated. Do not reuse these two messages there without
// that decision: the same bytes with a different anchor is precisely how a
// protocol acquires a downgrade path nobody designed.

// SealedClientHello opens the sealed-session handshake.
message SealedClientHello {
  // Ephemeral X25519 public key, 32 bytes.
  //
  // EPHEMERAL PER CONNECTION. Reusing one across sessions forfeits the forward
  // secrecy that is the entire reason ADR-22 supersedes the earlier
  // derived-key scheme: with a fresh pair per connection, a long-lived secret
  // obtained later cannot decrypt traffic recorded earlier.
  bytes public_key = 1;
}

// SealedServerHello answers it and proves the server holds the session's
// join-token-derived material.
message SealedServerHello {
  // Ephemeral X25519 public key, 32 bytes. Ephemeral per connection, as above.
  bytes public_key = 1;

  // HMAC-SHA256 over the handshake transcript, 32 bytes:
  //
  //   "cuvara/sealed-handshake/v1" || 0x00 || jti || 0x00
  //     || client_public (32) || server_public (32)
  //
  // BOTH EPHEMERAL PUBLIC KEYS ARE IN THE TRANSCRIPT, and that is what stops a
  // man in the middle: an attacker who substitutes its own key changes the
  // transcript, so the binding it read off the wire no longer verifies. Without
  // them, a replayed binding would authenticate the attacker's exchange as
  // readily as the real one and the MITM would be clean and undetectable.
  //
  // The NUL separators are load-bearing too. Without them the transcript is a
  // concatenation whose pieces can be re-split, so a jti ending in one byte of
  // the next field yields the same bytes as a different (jti, key) pair and a
  // MAC over it authenticates both readings equally.
  //
  // A receiver MUST compare this in constant time. A byte-by-byte comparison
  // leaks the position of the first mismatch, which is enough to forge a tag one
  // byte at a time against a peer that keeps answering — and this peer answers
  // every handshake attempt.
  bytes binding = 2;

  // Set when the server refuses the handshake. The client MUST NOT retry
  // without encryption: there is no cleartext fallback by design, because a
  // protocol that can be talked down to cleartext will be.
  string error = 3;

  // Ed25519 signature, 64 bytes, over the server's per-pod IDENTITY key
  // (ADR-25). This is the replacement for `binding` above, and it exists
  // because `binding` is a SYMMETRIC MAC under JOIN_TOKEN_SECRET: a client able
  // to verify it would hold the key the gateway mints join tokens with, and
  // could forge a token for any player on any server. `binding_verified` is
  // therefore permanently false for every shipped client, and no configuration
  // reaches true. An asymmetric signature has no such problem -- the client
  // needs only the public half.
  //
  // The signed input is NOT the transcript. It is:
  //
  //   "cuvara/sealed-identity/v1" || 0x00 || transcript || 0x00
  //     || identity_public (32)
  //
  // where `transcript` is EXACTLY the bytes described on `binding` above,
  // unchanged byte for byte. That is deliberate: key derivation
  // (DeriveDirectionKeys) and the HMAC binding keep their current bytes and
  // their current cross-implementation vectors, so this field adds a guarantee
  // without invalidating one. The identity key is inside the signed input
  // because a signature that does not name its signer authenticates a statement
  // ABOUT a key rather than a key, and the NUL separators are load-bearing for
  // the same re-splitting reason given on `binding`.
  //
  // The server ALWAYS signs. There is no negotiation and no fallback: a client
  // that has been told to check and cannot is refused, never downgraded. A
  // client that ignores this field behaves exactly as it did before, which is
  // what makes the server-and-gateway-first migration order safe.
  //
  // The public half needed to check this arrives out of band, in
  // EnterWorldResponse.server_public_key -- read the note there before
  // concluding that a verified signature means the server is authenticated. It
  // does not, while the gateway hop is plaintext.
  bytes server_signature = 4;
}
