name: Dev backup rehearsal

on:
  workflow_dispatch:
    inputs:
      target:
        description: Select the protected dev backup or isolated synthetic rehearsal
        type: choice
        required: true
        default: dev
        options:
          - dev
          - rehearsal
      restore_scratch:
        description: Restore the fresh PostgreSQL and Redis backups into scratch targets
        type: boolean
        required: false
        default: false

# Keep backup runs serialized independently from CD. Neither workflow can
# cancel a run in the other's concurrency group.
concurrency:
  group: backup-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Backup target (${{ inputs.target }})
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, dev]
    environment: dev
    steps:
      - name: Require write or admin permission
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const actor = context.actor;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: actor,
            });
            core.info(`Dispatch actor permission: ${data.permission}`);
            if (!['write', 'admin'].includes(data.permission)) {
              core.setFailed(`Actor ${actor} needs write or admin permission; got ${data.permission}.`);
            }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse an active testlab soak
        shell: bash
        run: |
          set -euo pipefail
          # The testlab currently has no shared lock-file contract. Inspect the
          # local process table as a guard; operators must still reserve a
          # no-soak window because process visibility may differ by runner host.
          if pgrep -f '[t]estlab[.]py.*(S09|soak)' >/dev/null; then
            echo "::error::A testlab soak appears active; refusing dev backup rehearsal."
            pgrep -l -f '[t]estlab[.]py.*(S09|soak)' || true
            exit 1
          fi

      - name: Back up PostgreSQL and Redis (missing targets are fatal)
        if: ${{ inputs.target == 'dev' }}
        id: backup
        env:
          BACKUP_DIR: ${{ vars.BACKUP_DIR || format('{0}/backups', vars.RPG_DEPLOY_DIR || '/opt/rpg-mmo') }}
          BACKUP_KEEP: ${{ vars.BACKUP_KEEP || '7' }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'nakama' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'nakama' }}
          POSTGRES_GAME_DB: ${{ vars.POSTGRES_GAME_DB || 'gamestate' }}
          POSTGRES_GAME_USER: ${{ vars.POSTGRES_GAME_USER || 'game' }}
          BACKUP_KUBE_CONTEXT: ${{ vars.DEPLOY_MODE == 'k8s' && (vars.KUBE_CONTEXT || 'k3d-rpg-dev') || '' }}
          BACKUP_KUBE_NAMESPACE: rpg-k8s-data
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          marker="$(mktemp)"
          # Deliberately omit --skip-missing: both scripts must fail if a target is absent.
          bash backend/deploy/db/backup.sh
          bash backend/deploy/db/redis-backup.sh

          metadata="$RUNNER_TEMP/dev-backup-metadata"
          mkdir -p "$metadata"
          mapfile -t fresh < <(find "$BACKUP_DIR" -type f \( -name '*.dump' -o -name '*.rdb' \) -newer "$marker" -print | sort)
          rm -f "$marker"
          if [ "${#fresh[@]}" -ne 3 ]; then
            echo "::error::Expected two fresh PostgreSQL dumps and one fresh Redis RDB; found ${#fresh[@]}."
            exit 1
          fi
          : > "$metadata/files.tsv"
          for file in "${fresh[@]}"; do
            printf '%s\t%s\t%s\n' "${file#"$BACKUP_DIR"/}" "$(stat -c '%s' "$file")" "$(sha256sum "$file" | cut -d ' ' -f1)" >> "$metadata/files.tsv"
          done
          printf 'metadata_dir=%s\n' "$metadata" >> "$GITHUB_OUTPUT"

      - name: Restore PostgreSQL backups into unique scratch databases
        if: ${{ inputs.target == 'dev' && inputs.restore_scratch }}
        env:
          BACKUP_DIR: ${{ vars.BACKUP_DIR || format('{0}/backups', vars.RPG_DEPLOY_DIR || '/opt/rpg-mmo') }}
          METADATA_DIR: ${{ steps.backup.outputs.metadata_dir }}
          BACKUP_KUBE_CONTEXT: ${{ vars.DEPLOY_MODE == 'k8s' && (vars.KUBE_CONTEXT || 'k3d-rpg-dev') || '' }}
          BACKUP_KUBE_NAMESPACE: rpg-k8s-data
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          for db in meta gamestate; do
            mapfile -t matches < <(awk -F '\t' -v prefix="$db/" 'index($1, prefix) == 1 && $1 ~ /\.dump$/ { print $1 }' "$METADATA_DIR/files.tsv")
            if [ "${#matches[@]}" -ne 1 ] || [ -z "${matches[0]}" ]; then
              echo "::error::Expected exactly one fresh PostgreSQL dump for '$db'; found ${#matches[@]}."
              exit 1
            fi
            relative="${matches[0]}"
            file="$BACKUP_DIR/$relative"
            bash backend/deploy/db/restore.sh --file "$file" --db "$db" --target "${db}_scratch_${stamp}" --yes
          done

      - name: Restore Redis backup in scratch mode
        if: ${{ inputs.target == 'dev' && inputs.restore_scratch }}
        env:
          BACKUP_DIR: ${{ vars.BACKUP_DIR || format('{0}/backups', vars.RPG_DEPLOY_DIR || '/opt/rpg-mmo') }}
          METADATA_DIR: ${{ steps.backup.outputs.metadata_dir }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t matches < <(awk -F '\t' '$1 ~ /^redis\/.*\.rdb$/ { print $1 }' "$METADATA_DIR/files.tsv")
          if [ "${#matches[@]}" -ne 1 ] || [ -z "${matches[0]}" ]; then
            echo "::error::Expected exactly one fresh Redis RDB; found ${#matches[@]}."
            exit 1
          fi
          relative="${matches[0]}"
          file="$BACKUP_DIR/$relative"
          bash backend/deploy/db/redis-restore.sh --file "$file" --mode scratch

      - name: Run isolated synthetic rehearsal
        if: ${{ inputs.target == 'rehearsal' }}
        id: r1
        env:
          R1_REHEARSAL_ROOT: ${{ vars.R1_REHEARSAL_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$R1_REHEARSAL_ROOT" ]; then
            echo "::error::Set the protected dev environment variable R1_REHEARSAL_ROOT to durable, restricted runner storage."
            exit 1
          fi
          bash backend/deploy/db/rehearsal.sh "$R1_REHEARSAL_ROOT"

      - name: Upload dev backup metadata only
        if: ${{ inputs.target == 'dev' }}
        uses: actions/upload-artifact@v4
        with:
          name: dev-backup-metadata-${{ github.run_id }}
          path: ${{ steps.backup.outputs.metadata_dir }}/files.tsv
          if-no-files-found: error
          retention-days: 14

      - name: Upload rehearsal metadata only
        if: ${{ inputs.target == 'rehearsal' }}
        uses: actions/upload-artifact@v4
        with:
          name: r1-rehearsal-metadata-${{ github.run_id }}
          path: ${{ steps.r1.outputs.run_dir }}/metadata.tsv
          if-no-files-found: error
          retention-days: 14
