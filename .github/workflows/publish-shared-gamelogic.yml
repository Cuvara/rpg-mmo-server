name: Publish Shared.GameLogic UPM Package

# Auto-tag and release when Shared.GameLogic changes land on main via merge.
# The tag (sgl-v{version}) is what Unity's UPM git resolver uses.

on:
  push:
    branches: [main]
    paths:
      - 'backend/gameserver-dotnet/Shared.GameLogic/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-sgl
  cancel-in-progress: false

jobs:
  test:
    name: Validate Shared.GameLogic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/gameserver-dotnet
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: >-
          dotnet test --no-build -c Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --blame-hang
          --blame-hang-timeout 8m
          --blame-hang-dump-type none

  publish:
    name: Tag & Release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(jq -r '.version' backend/gameserver-dotnet/Shared.GameLogic/package.json)
          TAG="sgl-v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}, tag: ${TAG}"

      - name: Check if tag already exists
        id: check
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not exist — will create"
          fi

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.tag }}" "${{ github.sha }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          # Build changelog from commits touching Shared.GameLogic since last sgl tag
          PREV_TAG=$(git tag -l 'sgl-v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --oneline -- backend/gameserver-dotnet/Shared.GameLogic/)
          else
            CHANGES=$(git log --oneline -- backend/gameserver-dotnet/Shared.GameLogic/ | head -20)
          fi

          gh release create "$TAG" \
            --title "Shared.GameLogic ${VERSION}" \
            --notes "$(cat <<EOF
          ## UPM Install

          \`\`\`json
          "com.rpgmmo.shared-gamelogic": "https://github.com/Cuvara/rpg-mmo-server.git?path=/backend/gameserver-dotnet/Shared.GameLogic#${TAG}"
          \`\`\`

          ## Changes since ${PREV_TAG:-initial}

          ${CHANGES:-No changes detected}
          EOF
          )"
