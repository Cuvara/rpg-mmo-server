name: CI — GameServer .NET

on:
  push:
    branches: [main, master, develop, staging]
    paths:
      - 'backend/gameserver-dotnet/**'
      - '.github/workflows/ci-dotnet.yml'

  # No `paths:` filter here, for the same reason as ci.yml: a filtered-out PR
  # reports no checks, which reads as "nothing to worry about" and is the exact
  # bug this change fixes.
  #
  # It also closes a specific hole. The Go and C# servers share a wire protocol
  # (`backend/shared/messages/` <-> `Shared.GameLogic`), so a PR that changes
  # wire types on the Go side alone previously matched no C# path and skipped
  # this workflow entirely.
  #
  # HONEST LIMIT — read before trusting a green check here: running this suite
  # on a Go-side wire change proves only that the C# side still builds and its
  # own unit tests pass. It does NOT verify wire compatibility, because these
  # tests exercise C# in isolation and cannot observe the Go encoder. The only
  # thing that actually catches a wire break is the cross-language E2E suite in
  # `backend/integration_test`, and today that runs solely in cd.yml on push —
  # never on a PR. Widening this filter is a real improvement but is not a
  # substitute for that; see docs/CICD.md "Known gap: wire-compat coverage".
  pull_request:
    branches: [main, master, develop, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    # The suite finishes in ~3 minutes when it finishes at all. Without this the
    # job inherits the 6-hour default, and three runs since 2026-08-08 have burned
    # exactly that: the Test step stops emitting output and nothing kills it.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/gameserver-dotnet
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # --blame-hang turns a hang into a failure that NAMES the test. Without it a
      # hung test is indistinguishable from a slow one: the runner log simply stops,
      # the .trx is never written, and the artifact upload reports "no files found"
      # — which is exactly what the 2026-08-08 runs looked like.
      #
      # 8 minutes is ~2.5x the whole suite's normal runtime, so it cannot fire on a
      # merely slow test on a 2-core runner. The hang dump is written next to the
      # results as Sequence_*.xml, listing the test that never returned.
      - name: Test
        run: >-
          dotnet test --no-build -c Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --blame-hang
          --blame-hang-timeout 8m
          --blame-hang-dump-type none

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/gameserver-dotnet/**/test-results.trx
            backend/gameserver-dotnet/**/Sequence_*.xml
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish AOT
    needs: test
    runs-on: ubuntu-latest
    # NativeAOT link is the slow part here (~5 min); 25 leaves room without
    # inheriting the 6-hour default.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend/gameserver-dotnet
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish NativeAOT
        run: dotnet publish GameServer/GameServer.csproj -c Release -o ./publish

      # ADR-11 decision 4: a clean publish demonstrably does not imply a working
      # binary. Arch allocates its chunk backing arrays through
      # System.Array.CreateInstance(Type, int), so a component whose T[] was not
      # statically constructed publishes with NO warning and then throws
      # NotSupportedException at runtime. `dotnet test` cannot see this — those
      # tests run on CoreCLR with a JIT.
      #
      # It also has to be a REAL JOIN, not a start-and-ping. The throw happens on
      # the first archetype creation, which is the first player spawn: the server
      # starts, logs "listening", accepts TCP, and only then dies. This was
      # re-measured on this branch by deliberately unhinting one component.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Smoke-run the native binary (real handshake)
        working-directory: backend/integration_test
        env:
          GAMESERVER_NATIVE_BIN: ../gameserver-dotnet/publish/GameServer
        run: go test -tags integration -run TestDotnetInterop -count=1 -timeout 15m ./...

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gameserver-dotnet
          path: backend/gameserver-dotnet/publish/
          retention-days: 7
