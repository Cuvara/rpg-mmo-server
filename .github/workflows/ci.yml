name: CI — Backend

# Validation only — never deploys. Every job is one call of the reusable
# per-module workflow (.github/workflows/_go-module.yml), so adding a module is
# a single additive block here.
#
# Graph:
#   test-shared
#     ├─► test-gateway ────┐
#     ├─► test-nakama ─────┤
#     ├─► test-smoketest ──┘
#     │         └─► test-integration ─► build-{gateway,smoketest}
#     ├─► test-loadtest
#     └─► test-verify-probe

on:
  # `develop` is the integration branch every feature PR targets, so it MUST be
  # listed here or those PRs get no checks at all. It was missing until now:
  # `gh pr checks <n>` on a develop-targeted PR reported "no checks reported",
  # which means Go changes reached develop with zero CI for the life of the
  # project. `staging` is listed for the same reason — cd.yml deploys from it.
  push:
    branches: [main, master, develop, staging]
    paths: ['backend/**', '.github/workflows/**']

  # NOTE: deliberately NO `paths:` filter on pull_request.
  #
  # A path-filtered workflow that does not match simply never runs, and GitHub
  # reports the PR as having no checks — indistinguishable at a glance from
  # "all checks passed". That is precisely the failure this change exists to
  # fix, and re-introducing it for a subset of PRs would re-create it in a
  # harder-to-spot form. Worse, if a required status check is ever added to
  # branch protection, a filtered-out PR blocks forever on a check that will
  # never report.
  #
  # So: every PR into a protected branch runs the full Go suite, even a
  # docs-only one. The cost is a few minutes of GitHub-hosted runner time; the
  # benefit is that "no checks" becomes an unambiguous signal that something is
  # misconfigured, never a normal state. Merge gating is worth more than CI
  # minutes.
  #
  # The `push` trigger above keeps its paths filter: pushes to shared branches
  # are frequent and already covered by the PR run that preceded them.
  pull_request:
    branches: [main, master, develop, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------- generated code drift
  # wire.proto is the single source of truth for the realtime wire format, and
  # the Go and C# bindings generated from it are COMMITTED so that no runner and
  # no fresh clone needs protoc. That trade has one failure mode: someone edits
  # generated code by hand, or changes wire.proto and forgets to regenerate, and
  # the two languages silently drift apart again — the exact problem the schema
  # exists to prevent.
  #
  # So this job regenerates both languages and fails if anything moved. The tool
  # versions are pinned exactly: protoc and protoc-gen-go both stamp their
  # version into the generated headers, so an unpinned bump would fail the diff
  # for no real reason.
  proto-generated:
    name: Proto bindings up to date
    runs-on: ubuntu-latest
    env:
      PROTOC_VERSION: '29.3'
      PROTOC_GEN_GO_VERSION: 'v1.36.6'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/shared/go.mod
          cache-dependency-path: backend/shared/go.sum

      - name: Install protoc
        run: |
          curl -sSLo /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          sudo install -m 0755 /tmp/protoc/bin/protoc /usr/local/bin/protoc
          protoc --version

      - name: Install protoc-gen-go
        run: |
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Regenerate
        run: ./backend/shared/proto/generate.sh

      - name: Fail if the committed bindings are stale
        run: |
          if ! git diff --exit-code -- \
              backend/shared/proto/gen \
              backend/gameserver-dotnet/GameServer/Net/Generated; then
            echo "::error::Generated protobuf bindings are out of date. Run backend/shared/proto/generate.sh and commit the result."
            exit 1
          fi

  # ------------------------------------------------------------- module tests
  test-shared:
    name: Test shared
    uses: ./.github/workflows/_go-module.yml
    with:
      module_dir: backend/shared
      test_flags: '-v -race -timeout 60s'

  test-gateway:
    name: Test gateway
    needs: test-shared
    uses: ./.github/workflows/_go-module.yml
    with:
      module_dir: backend/gateway
      test_flags: '-v -race -timeout 60s'
      run_build: go build ./cmd/gateway/

  test-nakama:
    name: Test nakama
    needs: test-shared
    uses: ./.github/workflows/_go-module.yml
    with:
      module_dir: backend/nakama
      test_flags: '-v -race -timeout 60s'
      # The shipped artifact is -buildmode=plugin (built in Docker by cd.yml);
      # here we only prove the packages compile.
      run_build: go build -o /dev/null ./...

  test-smoketest:
    name: Test smoketest
    needs: test-shared
    uses: ./.github/workflows/_go-module.yml
    with:
      module_dir: backend/smoketest
      # No external deps -> no go.sum; key the module cache on go.mod instead.
      cache_dependency_path: backend/smoketest/go.mod
      test_flags: '-v -race -timeout 60s'
      run_build: go build ./cmd/smoketest/

  test-loadtest:
    name: Test loadtest
    needs: test-shared
    uses: ./.github/workflows/_go-module.yml
    with:
      module_dir: backend/loadtest
      # Unit tests only: every test here is pure (percentiles, Prometheus
      # parsing, counter differencing, verdict logic). The network path needs a
      # live stack and is exercised by running the tool, not by CI.
      test_flags: '-v -race -timeout 60s'
      run_build: go build ./cmd/loadtest/

  test-verify-probe:
    name: Test verify probe
    needs: test-shared
    uses: ./.github/workflows/_go-module.yml
    with:
      module_dir: backend/deploy/k8s/verify/probe
      # The post-deploy verification suite's probe. cd.yml builds it into the
      # deployment bundle so the deploy job needs no Go toolchain; without this
      # job a probe that does not compile would surface for the first time in
      # `build-verify-probe` during a deploy, on a change that had already been
      # merged. It links against backend/shared via a replace directive, so a
      # wire-format change can break it here and nowhere else in CI.
      #
      # run_tests is false because this module has NO test files. `go test ./...`
      # would report a green `[no test files]`, which is the same ambiguous
      # signal test-integration's comment above exists to stamp out: a job that
      # says "tests passed" while asserting nothing. go vet still runs (it is
      # unconditional in the reusable workflow), and run_build proves it links.
      run_tests: false
      run_build: go build -o /dev/null .

  test-integration:
    name: Integration tests
    needs: [test-gateway, test-nakama, test-smoketest]
    uses: ./.github/workflows/_go-module.yml
    with:
      module_dir: backend/integration_test
      # `-tags integration` is MANDATORY: every test in this module sits behind
      # `//go:build integration`. Without it the package compiles to zero tests and
      # the job reports a green `[no test files]` — which it did, silently, for the
      # entire life of this suite.
      # The suite builds and runs the C# game server, hence needs_dotnet.
      needs_dotnet: true
      vet_flags: '-tags integration'
      test_flags: '-tags integration -v -race -timeout 300s'

  # ----------------------------------------------------------- build binaries
  build-gateway:
    name: Build gateway
    needs: test-integration
    uses: ./.github/workflows/_go-module.yml
    with:
      module_dir: backend/gateway
      run_tests: false
      run_build: go build -o ../../bin/gateway ./cmd/gateway/
      artifact_name: bin-gateway
      artifact_path: bin/gateway
      artifact_retention_days: 7

  build-smoketest:
    name: Build smoketest
    needs: test-integration
    uses: ./.github/workflows/_go-module.yml
    with:
      module_dir: backend/smoketest
      cache_dependency_path: backend/smoketest/go.mod
      run_tests: false
      run_build: go build -o ../../bin/smoketest ./cmd/smoketest/
      artifact_name: bin-smoketest
      artifact_path: bin/smoketest
      artifact_retention_days: 7
