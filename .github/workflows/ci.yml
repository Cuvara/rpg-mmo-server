name: CI — Backend

on:
  push:
    branches: [main, master]
    paths: ['backend/**']
  pull_request:
    branches: [main, master]
    paths: ['backend/**']

jobs:
  test-shared:
    name: Test shared module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go test ./... -v -race -timeout 60s
      - run: go vet ./...

  test-gameserver:
    name: Test gameserver module
    needs: test-shared
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/gameserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go test ./... -v -race -timeout 60s
      - run: go vet ./...
      - run: go build ./cmd/gameserver/

  test-gateway:
    name: Test gateway module
    needs: test-shared
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go test ./... -v -race -timeout 60s
      - run: go vet ./...
      - run: go build ./cmd/gateway/

  test-integration:
    name: Integration tests
    needs: [test-gameserver, test-gateway]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/integration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go test -v -race -timeout 60s

  build-all:
    name: Build all binaries
    needs: test-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build gameserver
        run: cd backend/gameserver && go build -o ../../bin/gameserver ./cmd/gameserver/
      - name: Build gateway
        run: cd backend/gateway && go build -o ../../bin/gateway ./cmd/gateway/
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: backend-binaries
          path: bin/
