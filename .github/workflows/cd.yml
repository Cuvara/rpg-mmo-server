name: CD — Build & Deploy

# Branch strategy:
#   develop    -> dev environment        (runner labels: self-hosted, dev)
#   staging    -> staging environment    (runner labels: self-hosted, staging)
#   release-*  -> production environment (runner labels: self-hosted, production)
#
# workflow_dispatch lets you deploy any ref to a chosen environment (also the
# rollback path: re-run a previous successful run of this workflow).
#
# ci.yml still owns PR/main validation — this workflow does not replace it.
#
# Job graph (each box is one job; per-module test/build jobs are calls of the
# reusable .github/workflows/_go-module.yml):
#
#   resolve ─────────────────────────────────────────────┐
#   test-shared ─┬─ test-gateway ──── build-gateway ──┐   │
#                ├─ test-smoketest ── build-smoketest ┤   │
#                ├─ test-nakama ───── build-plugin ───┤   │
#                └─ test-integration ────────────────►bundle
#                                     build-images(*)     │
#                                                         ▼
#                                      db-migrate (backup + schema)
#                                                         │
#                                                         ▼
#                                        deploy ─► post-deploy-smoke ─► summary
#   (*) build-images runs only for production / build_images=true and is not
#       on the deploy path.
#
# The `deploy` job has two modes, chosen per environment by vars.DEPLOY_MODE:
#   host       (default) — bundle binaries supervised by scripts/deploy-local.sh
#   containers           — images built on the runner, brought up by the compose
#                          `realtime` profile. See backend/deploy/docs/CICD.md.

on:
  push:
    branches: [develop, staging, 'release-*']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: dev
        options: [dev, staging, production]
      skip_tests:
        description: Skip Go tests in the test jobs (emergency only)
        type: boolean
        required: false
        default: false
      build_images:
        description: Build & push gateway/gameserver images to ghcr.io
        type: boolean
        required: false
        default: false

# One deploy at a time per environment; a newer push supersedes a queued one.
concurrency:
  group: cd-${{ github.event.inputs.environment || (github.ref_name == 'develop' && 'dev') || (github.ref_name == 'staging' && 'staging') || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- resolve
  resolve:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
      runner_labels: ${{ steps.map.outputs.runner_labels }}
    steps:
      - id: map
        name: Map ref -> environment + runner labels
        env:
          DISPATCH_ENV: ${{ github.event.inputs.environment }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_ENV}" ]; then
            target="${DISPATCH_ENV}"
          else
            case "${REF_NAME}" in
              develop)    target=dev ;;
              staging)    target=staging ;;
              release-*)  target=production ;;
              *) echo "::error::no environment mapping for ref '${REF_NAME}'"; exit 1 ;;
            esac
          fi
          case "${target}" in
            dev)        labels='["self-hosted","dev"]' ;;
            staging)    labels='["self-hosted","staging"]' ;;
            production) labels='["self-hosted","production"]' ;;
            *) echo "::error::unknown environment '${target}'"; exit 1 ;;
          esac
          echo "environment=${target}"       >> "$GITHUB_OUTPUT"
          echo "runner_labels=${labels}"     >> "$GITHUB_OUTPUT"
          echo "Deploying ref '${REF_NAME}' to '${target}' on runner ${labels}" >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------- module tests
  # Independent of `resolve` — they start immediately, in parallel with it.
  test-shared:
    name: Test shared
    uses: ./.github/workflows/_go-module.yml
    with:
      module_dir: backend/shared
      run_tests: ${{ github.event.inputs.skip_tests != 'true' }}

  test-gateway:
    name: Test gateway
    needs: test-shared
    uses: ./.github/workflows/_go-module.yml
    with:
      module_dir: backend/gateway
      run_tests: ${{ github.event.inputs.skip_tests != 'true' }}

  test-nakama:
    name: Test nakama
    needs: test-shared
    uses: ./.github/workflows/_go-module.yml
    with:
      module_dir: backend/nakama
      run_tests: ${{ github.event.inputs.skip_tests != 'true' }}

  test-smoketest:
    name: Test smoketest
    needs: test-shared
    uses: ./.github/workflows/_go-module.yml
    with:
      module_dir: backend/smoketest
      # No external deps -> no go.sum; key the module cache on go.mod instead.
      cache_dependency_path: backend/smoketest/go.mod
      run_tests: ${{ github.event.inputs.skip_tests != 'true' }}

  test-integration:
    name: Integration tests
    needs: [test-gateway, test-nakama, test-smoketest]
    uses: ./.github/workflows/_go-module.yml
    with:
      module_dir: backend/integration_test
      run_tests: ${{ github.event.inputs.skip_tests != 'true' }}
      # `-tags integration` is MANDATORY: every test in this module sits behind
      # `//go:build integration`. Without it the package compiles to zero tests and
      # the job reports a green `[no test files]` — which it did, silently, for the
      # entire life of this suite.
      # The suite builds and runs the C# game server, hence needs_dotnet.
      needs_dotnet: true
      vet_flags: '-tags integration'
      test_flags: '-tags integration -v -race -timeout 300s'

  # --------------------------------------------------------- build binaries
  # One job per binary; each starts as soon as its own module tests pass.
  build-gateway:
    name: Build gateway binary
    needs: test-gateway
    uses: ./.github/workflows/_go-module.yml
    with:
      module_dir: backend/gateway
      run_tests: false
      run_build: go build -o ../../bin/gateway ./cmd/gateway/
      artifact_name: bin-gateway-${{ github.sha }}
      artifact_path: bin/gateway

  build-smoketest:
    name: Build smoketest binary
    needs: test-smoketest
    uses: ./.github/workflows/_go-module.yml
    with:
      module_dir: backend/smoketest
      cache_dependency_path: backend/smoketest/go.mod
      run_tests: false
      run_build: go build -o ../../bin/smoketest ./cmd/smoketest/
      artifact_name: bin-smoketest-${{ github.sha }}
      artifact_path: bin/smoketest

  # ------------------------------------------------------------ nakama plugin
  # -buildmode=plugin is ABI-locked to the Nakama server image, so the .so is
  # built inside the matching container (see backend/deploy/nakama-plugin.Dockerfile).
  build-plugin:
    name: Build nakama plugin
    needs: test-nakama
    uses: ./.github/workflows/_go-module.yml
    with:
      module_dir: backend/nakama
      run_tests: false
      needs_docker: true
      # Build context MUST be backend/ — backend/nakama/go.mod has
      # `replace ... => ../shared`. The `export` stage emits nakama.so only.
      run_build: >-
        cd ../deploy &&
        DOCKER_BUILDKIT=1 docker build
        -f nakama-plugin.Dockerfile
        --build-arg NAKAMA_VERSION=3.40.0
        --target export
        --output type=local,dest=modules
        ..
      artifact_name: nakama-plugin-${{ github.sha }}
      artifact_path: backend/deploy/modules/nakama.so

  # --------------------------------------------------------- container images
  # Gateway + gameserver images are built and pushed to GHCR ONLY when:
  #   * the ref resolves to the production environment (release-* branch, or
  #     workflow_dispatch with environment=production), OR
  #   * workflow_dispatch was run with build_images=true.
  # Dev/staging deploys keep using host binaries from the artifact bundle, so
  # the common path stays fast and does not publish packages.
  # Image names MUST match backend/deploy/agones/fleet-{map,dungeon}.yaml.
  build-images:
    name: Build & push container images
    needs: [resolve, build-gateway]
    if: needs.resolve.outputs.environment == 'production' || github.event.inputs.build_images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Short sha
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is backend/ — both go.mod files have `replace ... => ../shared`.
      - name: Build & push gateway image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/deploy/docker/Dockerfile.gateway
          push: true
          tags: |
            ghcr.io/dycuong03/rpg-mmo-gateway:${{ steps.meta.outputs.short_sha }}
            ghcr.io/dycuong03/rpg-mmo-gateway:latest
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

      - name: Build & push gameserver-dotnet image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/deploy/docker/Dockerfile.gameserver-dotnet
          push: true
          tags: |
            ghcr.io/dycuong03/rpg-mmo-gameserver-dotnet:${{ steps.meta.outputs.short_sha }}
            ghcr.io/dycuong03/rpg-mmo-gameserver-dotnet:latest
          cache-from: type=gha,scope=gameserver-dotnet
          cache-to: type=gha,scope=gameserver-dotnet,mode=max

      - name: Image summary
        run: |
          {
            echo "### Container images pushed"
            echo ""
            echo "- \`ghcr.io/dycuong03/rpg-mmo-gateway:${{ steps.meta.outputs.short_sha }}\` (+ \`:latest\`)"
            echo "- \`ghcr.io/dycuong03/rpg-mmo-gameserver-dotnet:${{ steps.meta.outputs.short_sha }}\` (+ \`:latest\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ bundle
  # Assemble everything the runner needs into one artifact. Nothing is compiled
  # here — only artifacts + repo files are collected.
  bundle:
    name: Assemble deployment bundle
    needs: [test-integration, build-gateway, build-smoketest, build-plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*-${{ github.sha }}
          merge-multiple: true
          path: dist/bin

      - name: Download nakama plugin
        uses: actions/download-artifact@v4
        with:
          name: nakama-plugin-${{ github.sha }}
          path: dist/deploy

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Build C# gameserver (NativeAOT)
        working-directory: backend/gameserver-dotnet
        run: |
          dotnet publish GameServer/GameServer.csproj -c Release -o ../../dist/bin/dotnet-publish
          mv ../../dist/bin/dotnet-publish/GameServer ../../dist/bin/gameserver-dotnet
          rm -rf ../../dist/bin/dotnet-publish
          chmod +x ../../dist/bin/gameserver-dotnet

      - name: Stage deployment bundle
        run: |
          set -euo pipefail
          mkdir -p dist/bin dist/deploy dist/scripts
          cp backend/deploy/docker-compose.yml dist/deploy/
          cp backend/deploy/Makefile dist/deploy/
          cp backend/deploy/.env.example dist/deploy/
          # Everything docker-compose.yml bind-mounts must travel with it, or
          # `compose up` on a fresh host fails (or, worse, docker creates an
          # empty DIRECTORY where a config file was expected):
          #   monitoring/  -> lgtm (prometheus.yaml, dashboards provider + JSON)
          #   db/          -> postgres-game init SQL
          cp -r backend/deploy/monitoring dist/deploy/monitoring
          cp -r backend/deploy/db         dist/deploy/db
          cp scripts/deploy-local.sh dist/scripts/
          echo "${GITHUB_SHA}" > dist/COMMIT
          for f in bin/gateway bin/smoketest bin/gameserver-dotnet deploy/nakama.so \
                   scripts/deploy-local.sh \
                   deploy/monitoring/prometheus.yaml \
                   deploy/monitoring/grafana-dashboards.yaml \
                   deploy/monitoring/dashboards/rpg-gameplay.json \
                   deploy/db/init-gamestate.sql \
                   deploy/db/migrations/gamestate/001_init.sql \
                   deploy/db/backup.sh \
                   deploy/db/restore.sh \
                   deploy/db/redis-backup.sh \
                   deploy/db/redis-restore.sh; do
            [ -f "dist/$f" ] || { echo "::error::missing dist/$f"; exit 1; }
          done
          ls -lhR dist

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
          # dist/deploy/.env.example is a dotfile; v4 drops hidden files by default.
          include-hidden-files: true

  # ------------------------------------------------------------- db-migrate
  # Schema work happens here, on the deploy runner, BEFORE any new binary is
  # installed or restarted. Ordering rationale:
  #
  #   1. Back up first. The backup is worthless if it is taken after a bad
  #      migration, so it is the first thing that happens and a failure here
  #      aborts the deploy (except on a first-ever deploy, where the containers
  #      do not exist yet — --skip-missing turns that into a warning).
  #   2. Migrate with the NEW binary against the OLD running servers. Migrations
  #      must therefore be backward compatible with the currently-deployed code,
  #      which is the normal expand/contract rule.
  #   3. Only then does `deploy` install and restart the binaries.
  #
  # The gameserver also migrates at boot (idempotently, under an advisory lock),
  # so this job is about determinism and a backup checkpoint, not correctness:
  # if it is skipped the schema still converges, just at an unpredictable moment
  # and with no backup taken.
  db-migrate:
    name: Back up + migrate databases
    needs: [resolve, bundle]
    runs-on: ${{ fromJSON(needs.resolve.outputs.runner_labels) }}
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download deployment bundle
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle-${{ github.sha }}
          path: dist

      - name: Back up both databases + Redis
        env:
          # Default under the deploy dir, which the runner owns. /var/backups is
          # root-only on a stock host and CD does not run as root; point
          # vars.BACKUP_DIR at a provisioned path when there is one.
          BACKUP_DIR: ${{ vars.BACKUP_DIR || format('{0}/backups', vars.RPG_DEPLOY_DIR || '/opt/rpg-mmo') }}
          BACKUP_KEEP: ${{ vars.BACKUP_KEEP || '7' }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'nakama' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'nakama' }}
        run: |
          set -euo pipefail
          # --skip-missing: on a first-ever deploy the postgres containers do not
          # exist yet, and "nothing to back up" must not block the first deploy.
          bash backend/deploy/db/backup.sh --skip-missing
          # Redis is a system of record too (server registry + event stream, see
          # ADR-4), so it gets the same pre-deploy checkpoint. Same --skip-missing
          # rationale. Writes to $BACKUP_DIR/redis/.
          #
          # NON-FATAL, unlike the PostgreSQL dumps above. The PG backup gates a
          # schema migration — deploying past a failed dump risks unrecoverable
          # data — so it stays fatal. Redis holds only transient or
          # reconstructible state (sessions expire and clients re-auth; the
          # registry and event streams are rebuilt by running servers), so a
          # missing Redis checkpoint must never block a deploy. See
          # backend/deploy/docs/DISASTER-RECOVERY.md.
          bash backend/deploy/db/redis-backup.sh --skip-missing \
            || echo "::warning::redis backup failed (non-fatal, see DR doc)"

      - name: Apply pending migrations
        env:
          GAME_DB_URL: ${{ vars.GAME_DB_URL || '' }}
        run: |
          set -euo pipefail
          if [ -z "${GAME_DB_URL}" ]; then
            echo "GAME_DB_URL is not set for this environment — the gameserver runs on the"
            echo "in-memory store, so there is no schema to migrate. Skipping."
            echo "- db-migrate: skipped (GAME_DB_URL unset)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          chmod +x dist/bin/gameserver-dotnet
          # Exits non-zero on unreachable DB, failed migration, or checksum drift.
          ./dist/bin/gameserver-dotnet --migrate-only --game-db-url "${GAME_DB_URL}"
          echo "- db-migrate: migrations applied" >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------- deploy
  deploy:
    name: Deploy to ${{ needs.resolve.outputs.environment }}
    needs: [resolve, bundle, db-migrate]
    runs-on: ${{ fromJSON(needs.resolve.outputs.runner_labels) }}
    environment: ${{ needs.resolve.outputs.environment }}
    outputs:
      deploy_dir: ${{ steps.paths.outputs.deploy_dir }}
      deploy_mode: ${{ steps.paths.outputs.deploy_mode }}
    steps:
      # DEPLOY_MODE picks how the realtime services run on this box:
      #   host       (default) — prebuilt binaries from the bundle, supervised by
      #                          scripts/deploy-local.sh (systemd or nohup).
      #   containers          — gateway + gameserver images are built on this
      #                          runner and brought up by the compose `realtime`
      #                          profile, sharing the meta stack's network.
      # Everything else (secrets, ports, monitoring) is identical, so moving an
      # environment between the two is a single variable flip.
      - name: Resolve deploy dir + mode
        id: paths
        env:
          RPG_DEPLOY_DIR: ${{ vars.RPG_DEPLOY_DIR || '/opt/rpg-mmo' }}
          DEPLOY_MODE: ${{ vars.DEPLOY_MODE || 'host' }}
        run: |
          set -euo pipefail
          case "${DEPLOY_MODE}" in
            host|containers) ;;
            *) echo "::error::vars.DEPLOY_MODE must be 'host' or 'containers' (got '${DEPLOY_MODE}')"; exit 1 ;;
          esac
          echo "deploy_dir=${RPG_DEPLOY_DIR}" >> "$GITHUB_OUTPUT"
          echo "deploy_mode=${DEPLOY_MODE}"   >> "$GITHUB_OUTPUT"
          echo "deploy mode: ${DEPLOY_MODE}"

      # Needed only by containers mode (the image build needs the Dockerfiles
      # and sources), but checking out unconditionally keeps the job simple and
      # costs a few seconds.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download deployment bundle
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle-${{ github.sha }}
          path: dist

      - name: Sync bundle into the deploy directory
        env:
          RPG_DEPLOY_DIR: ${{ vars.RPG_DEPLOY_DIR || '/opt/rpg-mmo' }}
        run: |
          set -euo pipefail
          mkdir -p "$RPG_DEPLOY_DIR"/{bin,deploy,scripts,run,logs}
          # Keep the previous binaries so a manual rollback is one `mv` away.
          for b in gateway gameserver-dotnet; do
            [ -f "$RPG_DEPLOY_DIR/bin/$b" ] && cp -f "$RPG_DEPLOY_DIR/bin/$b" "$RPG_DEPLOY_DIR/bin/$b.prev" || true
          done
          install -m 0755 dist/bin/gateway            "$RPG_DEPLOY_DIR/bin/gateway"
          install -m 0755 dist/bin/gameserver-dotnet   "$RPG_DEPLOY_DIR/bin/gameserver-dotnet"
          install -m 0755 dist/bin/smoketest           "$RPG_DEPLOY_DIR/bin/smoketest"
          install -m 0755 dist/scripts/deploy-local.sh "$RPG_DEPLOY_DIR/scripts/deploy-local.sh"
          mkdir -p "$RPG_DEPLOY_DIR/deploy/modules"
          install -m 0644 dist/deploy/nakama.so          "$RPG_DEPLOY_DIR/deploy/modules/nakama.so"
          install -m 0644 dist/deploy/docker-compose.yml "$RPG_DEPLOY_DIR/deploy/docker-compose.yml"
          install -m 0644 dist/deploy/Makefile           "$RPG_DEPLOY_DIR/deploy/Makefile"
          install -m 0644 dist/deploy/.env.example       "$RPG_DEPLOY_DIR/deploy/.env.example"
          # Compose bind-mount sources. Replaced wholesale so a file deleted in
          # git also disappears on the host; docker re-reads them on `up`.
          # Prometheus and Grafana read these files ONCE, at container start, so
          # a changed config is invisible until lgtm is recreated — a silent
          # "deployed but not applied". Hash before/after to drive the restart
          # in the compose step below.
          hash_dir() { [ -d "$1" ] && find "$1" -type f -exec sha256sum {} + | sort -k2 | sha256sum | cut -d' ' -f1 || echo none; }
          mon_before="$(hash_dir "$RPG_DEPLOY_DIR/deploy/monitoring")"
          for d in monitoring db; do
            rm -rf "$RPG_DEPLOY_DIR/deploy/$d"
            cp -r "dist/deploy/$d" "$RPG_DEPLOY_DIR/deploy/$d"
            chmod -R a+rX "$RPG_DEPLOY_DIR/deploy/$d"
          done
          mon_after="$(hash_dir "$RPG_DEPLOY_DIR/deploy/monitoring")"
          if [ "$mon_before" = "$mon_after" ]; then
            echo "MONITORING_CONFIG_CHANGED=0" >> "$GITHUB_ENV"
            echo "monitoring config unchanged"
          else
            echo "MONITORING_CONFIG_CHANGED=1" >> "$GITHUB_ENV"
            echo "monitoring config CHANGED — lgtm will be restarted"
          fi
          cp dist/COMMIT "$RPG_DEPLOY_DIR/COMMIT"

      # Secrets come from the GitHub Environment (dev / staging / production).
      # Written with umask 077 and never echoed.
      - name: Write environment file
        env:
          RPG_DEPLOY_DIR: ${{ vars.RPG_DEPLOY_DIR || '/opt/rpg-mmo' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # Signs/verifies the gateway->gameserver join token on both binaries.
          # Deliberately separate from JWT_SECRET: a compromised game server must
          # not be able to forge client auth tokens. Both refuse to start unset.
          JOIN_TOKEN_SECRET: ${{ secrets.JOIN_TOKEN_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          NAKAMA_CONSOLE_PASSWORD: ${{ secrets.NAKAMA_CONSOLE_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          NAKAMA_SERVER_KEY: ${{ secrets.NAKAMA_SERVER_KEY }}
          NAKAMA_VERSION: ${{ vars.NAKAMA_VERSION || '3.40.0' }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'nakama' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'nakama' }}
          NAKAMA_CONSOLE_USER: ${{ vars.NAKAMA_CONSOLE_USER || 'admin' }}
          GATEWAY_ADDR: ${{ vars.GATEWAY_ADDR || ':8000' }}
          GAMESERVER_ADDR: ${{ vars.GAMESERVER_ADDR || ':9000' }}
          GAMESERVER_MAP_ID: ${{ vars.GAMESERVER_MAP_ID || 'map_01' }}
          # Multi-rate simulation. SIM_CRITICAL_HZ is the BASE tick rate; the
          # other two must divide it exactly and must not exceed it, or the game
          # server exits 2 at startup instead of rounding. Snapshots ship at the
          # WORLD rate, so SIM_WORLD_HZ is the one that moves bandwidth per
          # client. See backend/gameserver-dotnet/docs/README.md.
          SIM_CRITICAL_HZ: ${{ vars.SIM_CRITICAL_HZ || '60' }}
          SIM_WORLD_HZ: ${{ vars.SIM_WORLD_HZ || '15' }}
          SIM_BACKGROUND_HZ: ${{ vars.SIM_BACKGROUND_HZ || '5' }}
          REDIS_ADDR: ${{ vars.REDIS_ADDR || 'localhost:6379' }}
          GAME_DB_URL: ${{ vars.GAME_DB_URL || '' }}
          # --- containers mode (compose `realtime` profile) --------------------
          DEPLOY_MODE: ${{ steps.paths.outputs.deploy_mode }}
          # Published host ports for the realtime containers. Empty = derive them
          # from GATEWAY_ADDR / GAMESERVER_ADDR below, so the containers take
          # over exactly the ports every other component already expects.
          GATEWAY_CONTAINER_PORT: ${{ vars.GATEWAY_CONTAINER_PORT || '' }}
          GAMESERVER_CONTAINER_PORT: ${{ vars.GAMESERVER_CONTAINER_PORT || '' }}
          GATEWAY_METRICS_PORT: ${{ vars.GATEWAY_METRICS_PORT || '9102' }}
          GAMESERVER_METRICS_PORT: ${{ vars.GAMESERVER_METRICS_PORT || '9101' }}
          # Listen address of the C# metrics endpoint INSIDE its container.
          # A wildcard is correct and works; it used to have to be a resolvable
          # name because the C# listener could not bind one.
          GAMESERVER_METRICS_ADDR: ${{ vars.GAMESERVER_METRICS_ADDR || ':9101' }}
          # The address handed to CLIENTS in MsgEnterWorldResp.ServerAddr,
          # VERBATIM — so it must be an address the client can dial. It is not
          # the listen address whenever ports are published. Leaving it empty is
          # only tolerated on `dev`, where it is filled in with loopback below;
          # staging and production must set it explicitly or the deploy fails.
          # See "Measured constants" / the transport notes in
          # backend/gameserver-dotnet/docs/API.md.
          GAMESERVER_PUBLIC_ADDR: ${{ vars.GAMESERVER_PUBLIC_ADDR || '' }}
          DEPLOY_ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          # --- monitoring (compose `monitoring` profile / grafana-otel-lgtm) ---
          MONITORING_ENABLED: ${{ vars.MONITORING_ENABLED || 'true' }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_USER: ${{ vars.GRAFANA_USER || 'admin' }}
          GRAFANA_ANONYMOUS: ${{ vars.GRAFANA_ANONYMOUS || 'false' }}
          GRAFANA_PORT: ${{ vars.GRAFANA_PORT || '3000' }}
          GRAFANA_BIND: ${{ vars.GRAFANA_BIND || '0.0.0.0' }}
          PROMETHEUS_PORT: ${{ vars.PROMETHEUS_PORT || '9090' }}
          PROMETHEUS_BIND: ${{ vars.PROMETHEUS_BIND || '127.0.0.1' }}
          OTLP_GRPC_PORT: ${{ vars.OTLP_GRPC_PORT || '4317' }}
          OTLP_HTTP_PORT: ${{ vars.OTLP_HTTP_PORT || '4318' }}
          OTLP_BIND: ${{ vars.OTLP_BIND || '127.0.0.1' }}
          OTEL_LGTM_VERSION: ${{ vars.OTEL_LGTM_VERSION || '0.11.15' }}
        run: |
          set -euo pipefail
          for required in JWT_SECRET JOIN_TOKEN_SECRET POSTGRES_PASSWORD NAKAMA_CONSOLE_PASSWORD; do
            if [ -z "${!required}" ]; then
              echo "::error::environment secret ${required} is not set"
              exit 1
            fi
          done
          # The whole point of the split is that a compromised game server can
          # verify join tokens without being able to mint client auth tokens.
          # Reusing one value for both gives that away silently.
          if [ "${JOIN_TOKEN_SECRET}" = "${JWT_SECRET}" ]; then
            echo "::error::JOIN_TOKEN_SECRET must not equal JWT_SECRET — generate a separate value (openssl rand -hex 32)"
            exit 1
          fi
          # Monitoring is on unless vars.MONITORING_ENABLED is exactly 'false'.
          # When it is on, the Grafana admin password is as mandatory as the
          # other secrets: a Grafana published on 0.0.0.0 with a default
          # password is an open door.
          if [ "${MONITORING_ENABLED}" != "false" ] && [ -z "${GRAFANA_ADMIN_PASSWORD}" ]; then
            echo "::error::environment secret GRAFANA_ADMIN_PASSWORD is not set (required while vars.MONITORING_ENABLED != 'false')"
            exit 1
          fi
          # Container ports default to the ports the listen addresses already
          # name, so ":8000"/":9200" stay true whichever mode is active.
          : "${GATEWAY_CONTAINER_PORT:=${GATEWAY_ADDR##*:}}"
          : "${GAMESERVER_CONTAINER_PORT:=${GAMESERVER_ADDR##*:}}"
          # GAMESERVER_PUBLIC_ADDR is handed to clients verbatim, so it must be
          # DIALABLE BY THEM. This used to default to ":<port>" — hostless — on
          # the belief that clients normalize it to loopback. Only some do: the
          # Go smoketest rewrites listen-style addresses, a C# TcpClient throws
          # on one. A hostless value therefore fails two steps later, in the
          # client, where nobody looks — so it is refused here instead.
          if [ -z "${GAMESERVER_PUBLIC_ADDR}" ]; then
            case "${DEPLOY_ENVIRONMENT}" in
              dev)
                # The dev box IS the client's host: runner, stack and client all
                # sit on one machine. Loopback is correct and nothing else can be
                # inferred without knowing the operator's network.
                GAMESERVER_PUBLIC_ADDR=":${GAMESERVER_CONTAINER_PORT}"
                GAMESERVER_PUBLIC_ADDR="127.0.0.1${GAMESERVER_PUBLIC_ADDR}"
                echo "::notice::GAMESERVER_PUBLIC_ADDR unset; defaulting to ${GAMESERVER_PUBLIC_ADDR} for the dev environment. Set vars.GAMESERVER_PUBLIC_ADDR if clients connect from another machine (e.g. a phone on the LAN)."
                ;;
              *)
                echo "::error::GAMESERVER_PUBLIC_ADDR is not set for environment '${DEPLOY_ENVIRONMENT}'. It is handed to clients verbatim, so there is no safe default off the dev box — loopback would tell every client to dial itself. Set the '${DEPLOY_ENVIRONMENT}' environment variable GAMESERVER_PUBLIC_ADDR to <public-host-or-ip>:${GAMESERVER_CONTAINER_PORT}."
                exit 1
                ;;
            esac
          fi
          # Reject a hostless value however it arrived — including one set
          # explicitly. The host list matches NormalizeDialAddr in
          # backend/smoketest/smoke/helpers.go, so both ends agree on what counts
          # as listen-style.
          gs_host="${GAMESERVER_PUBLIC_ADDR%:*}"
          case "${gs_host}" in
            ""|"0.0.0.0"|"::"|"[::]")
              echo "::error::GAMESERVER_PUBLIC_ADDR='${GAMESERVER_PUBLIC_ADDR}' has no usable host part. Clients receive this value verbatim and cannot dial it. Use <public-host-or-ip>:${GAMESERVER_CONTAINER_PORT}."
              exit 1
              ;;
          esac
          umask 077
          envfile="$RPG_DEPLOY_DIR/deploy/.env"
          {
            echo "# Generated by CD ($GITHUB_RUN_ID) — do not edit by hand."
            echo "NAKAMA_VERSION=${NAKAMA_VERSION}"
            echo "POSTGRES_DB=${POSTGRES_DB}"
            echo "POSTGRES_USER=${POSTGRES_USER}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "REDIS_PASSWORD=${REDIS_PASSWORD}"
            echo "REDIS_ADDR=${REDIS_ADDR}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "JOIN_TOKEN_SECRET=${JOIN_TOKEN_SECRET}"
            echo "NAKAMA_CONSOLE_USER=${NAKAMA_CONSOLE_USER}"
            echo "NAKAMA_CONSOLE_PASSWORD=${NAKAMA_CONSOLE_PASSWORD}"
            echo "NAKAMA_SERVER_KEY=${NAKAMA_SERVER_KEY:-defaultkey}"
            echo "GATEWAY_ADDR=${GATEWAY_ADDR}"
            echo "GAMESERVER_ADDR=${GAMESERVER_ADDR}"
            echo "GAMESERVER_MAP_ID=${GAMESERVER_MAP_ID}"
            echo "GAMESERVER_RUNTIME=dotnet"
            echo "SIM_CRITICAL_HZ=${SIM_CRITICAL_HZ}"
            echo "SIM_WORLD_HZ=${SIM_WORLD_HZ}"
            echo "SIM_BACKGROUND_HZ=${SIM_BACKGROUND_HZ}"
            echo "GAMESERVER_ID=gs-dotnet-${GAMESERVER_MAP_ID}"
            echo "GAME_DB_URL=${GAME_DB_URL}"
            echo "DEPLOY_MODE=${DEPLOY_MODE}"
            echo "GATEWAY_CONTAINER_PORT=${GATEWAY_CONTAINER_PORT}"
            echo "GAMESERVER_CONTAINER_PORT=${GAMESERVER_CONTAINER_PORT}"
            echo "GATEWAY_METRICS_PORT=${GATEWAY_METRICS_PORT}"
            echo "GAMESERVER_METRICS_PORT=${GAMESERVER_METRICS_PORT}"
            echo "GAMESERVER_METRICS_ADDR=${GAMESERVER_METRICS_ADDR}"
            echo "GAMESERVER_PUBLIC_ADDR=${GAMESERVER_PUBLIC_ADDR}"
            echo "GATEWAY_IMAGE=rpg-mmo/gateway:${GITHUB_SHA}"
            echo "GAMESERVER_IMAGE=rpg-mmo/gameserver-dotnet:${GITHUB_SHA}"
            echo "MONITORING_ENABLED=${MONITORING_ENABLED}"
            echo "OTEL_LGTM_VERSION=${OTEL_LGTM_VERSION}"
            echo "GRAFANA_USER=${GRAFANA_USER}"
            echo "GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}"
            echo "GRAFANA_ANONYMOUS=${GRAFANA_ANONYMOUS}"
            echo "GRAFANA_PORT=${GRAFANA_PORT}"
            echo "GRAFANA_BIND=${GRAFANA_BIND}"
            echo "PROMETHEUS_PORT=${PROMETHEUS_PORT}"
            echo "PROMETHEUS_BIND=${PROMETHEUS_BIND}"
            echo "OTLP_GRPC_PORT=${OTLP_GRPC_PORT}"
            echo "OTLP_HTTP_PORT=${OTLP_HTTP_PORT}"
            echo "OTLP_BIND=${OTLP_BIND}"
          } > "$envfile"
          chmod 600 "$envfile"
          echo "wrote $envfile ($(wc -l < "$envfile") vars, values redacted)"

      # ---------------------------------------------------- containers mode only
      # Host-mode processes own the same ports the containers are about to
      # publish, so they have to go first. Safe when nothing is running:
      # deploy-local.sh stop just reports "not running" for a missing pidfile.
      - name: Stop host-mode realtime services
        if: steps.paths.outputs.deploy_mode == 'containers'
        env:
          RPG_DEPLOY_DIR: ${{ vars.RPG_DEPLOY_DIR || '/opt/rpg-mmo' }}
        run: |
          set -euo pipefail
          chmod +x "$RPG_DEPLOY_DIR/scripts/deploy-local.sh"
          "$RPG_DEPLOY_DIR/scripts/deploy-local.sh" stop

      # Built HERE, on the deploy target, rather than pulled from a registry:
      # dev/staging have no registry credentials and the images never leave this
      # box. `build-images` (GHCR) stays the production/k8s path.
      #
      # Contexts are NOT the same: the gateway needs backend/ (its go.mod has
      # `replace ... => ../shared`), and the C# Dockerfile also copies from
      # backend/gameserver-dotnet/, so backend/ covers both. Paths are kept
      # cwd-relative — under WSL `docker` is a shim for docker.exe, which cannot
      # resolve absolute /mnt/* paths.
      - name: Build realtime images on the runner
        if: steps.paths.outputs.deploy_mode == 'containers'
        working-directory: backend
        run: |
          set -euo pipefail
          docker build -f deploy/docker/Dockerfile.gateway \
            -t "rpg-mmo/gateway:${GITHUB_SHA}" -t rpg-mmo/gateway:dev .
          docker build -f deploy/docker/Dockerfile.gameserver-dotnet \
            -t "rpg-mmo/gameserver-dotnet:${GITHUB_SHA}" -t rpg-mmo/gameserver-dotnet:dev .
          docker image ls --filter reference='rpg-mmo/*' \
            --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'

      # postgres + redis + nakama (+ the `monitoring` profile: grafana/otel-lgtm,
      # + the `realtime` profile in containers mode: gateway + gameserver).
      # The plugin .so is mounted from ./modules, monitoring configs from
      # ./monitoring — both installed by the sync step above.
      - name: Start / update the stack (docker compose)
        env:
          RPG_DEPLOY_DIR: ${{ vars.RPG_DEPLOY_DIR || '/opt/rpg-mmo' }}
          MONITORING_ENABLED: ${{ vars.MONITORING_ENABLED || 'true' }}
          DEPLOY_MODE: ${{ steps.paths.outputs.deploy_mode }}
        working-directory: ${{ vars.RPG_DEPLOY_DIR || '/opt/rpg-mmo' }}
        run: |
          set -euo pipefail
          cd "$RPG_DEPLOY_DIR/deploy"
          # Monitoring ships by default; set vars.MONITORING_ENABLED='false' on
          # an environment to deploy the plain meta stack instead. With the
          # profile off, --remove-orphans also tears the lgtm container down,
          # so the flag is a real on/off switch and not just "stop deploying it".
          profile_args=()
          if [ "${MONITORING_ENABLED}" != "false" ]; then
            profile_args=(--profile monitoring)
            echo "monitoring profile: ENABLED"
          else
            echo "monitoring profile: disabled (vars.MONITORING_ENABLED=false)"
          fi
          # In containers mode the realtime profile joins in, so the gateway and
          # game server come up on the compose network next to redis/postgres.
          # In host mode it stays off and --remove-orphans removes any leftover
          # realtime containers, making the switch reversible in one variable.
          if [ "${DEPLOY_MODE}" = "containers" ]; then
            profile_args+=(--profile realtime)
            echo "realtime profile: ENABLED (DEPLOY_MODE=containers)"
          else
            echo "realtime profile: disabled (DEPLOY_MODE=host)"
          fi
          # `pull` cannot fetch the locally built rpg-mmo/* tags — tolerated, the
          # images are already in the daemon's store.
          docker compose "${profile_args[@]}" pull --quiet || true
          docker compose "${profile_args[@]}" up -d --remove-orphans
          # `up -d` does NOT recreate a container whose bind-mounted files
          # changed — only its image/config/env are compared. Without this, a
          # new prometheus.yaml or dashboard sits on disk unread until someone
          # happens to restart lgtm.
          if [ "${MONITORING_ENABLED}" != "false" ] && [ "${MONITORING_CONFIG_CHANGED:-0}" = "1" ]; then
            echo "restarting lgtm to pick up the new monitoring config"
            docker compose "${profile_args[@]}" restart lgtm
          fi
          docker compose "${profile_args[@]}" ps
          # The gameserver opens GAME_DB_URL at boot and exits(1) if postgres-game
          # is not accepting connections yet, so wait for its healthcheck before
          # the restart step below.
          for _ in $(seq 1 60); do
            state="$(docker inspect -f '{{.State.Health.Status}}' rpg-postgres-game 2>/dev/null || echo missing)"
            echo "postgres-game: ${state}"
            [ "${state}" = healthy ] && break
            sleep 2
          done

      # ------------------------------------------------------- host mode only
      # deploy-local.sh both (re)starts the binaries AND writes the game
      # server's Redis registry entry; in containers mode compose owns the
      # processes and the registration is a separate step below.
      - name: Restart realtime services (systemd, else nohup)
        if: steps.paths.outputs.deploy_mode == 'host'
        env:
          RPG_DEPLOY_DIR: ${{ vars.RPG_DEPLOY_DIR || '/opt/rpg-mmo' }}
        run: |
          set -euo pipefail
          chmod +x "$RPG_DEPLOY_DIR/scripts/deploy-local.sh"
          "$RPG_DEPLOY_DIR/scripts/deploy-local.sh" restart

      - name: Post-deploy healthcheck (host mode)
        if: steps.paths.outputs.deploy_mode == 'host'
        env:
          RPG_DEPLOY_DIR: ${{ vars.RPG_DEPLOY_DIR || '/opt/rpg-mmo' }}
        run: |
          set -euo pipefail
          "$RPG_DEPLOY_DIR/scripts/deploy-local.sh" health
          "$RPG_DEPLOY_DIR/scripts/deploy-local.sh" status

      # No registration step: the C# game server registers itself in Redis on
      # startup and heartbeats every 5s (TTL 15s). It reads REDIS_ADDR and
      # advertises GAMESERVER_PUBLIC_ADDR, both supplied by deploy/.env through
      # docker-compose.yml — on a VPS that must be the public host:port.

      # Both runtime images expose /healthz on their metrics port — the gateway
      # from backend/gateway/metrics, the C# server from
      # GameServer/Observability/MetricsEndpoint.cs. That is a real liveness
      # signal (the process is serving), unlike a bare TCP connect, and it works
      # from the host even though the gateway image is distroless.
      - name: Post-deploy healthcheck (containers mode)
        if: steps.paths.outputs.deploy_mode == 'containers'
        env:
          RPG_DEPLOY_DIR: ${{ vars.RPG_DEPLOY_DIR || '/opt/rpg-mmo' }}
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          . "$RPG_DEPLOY_DIR/deploy/.env"
          set +a

          probe() { # name url [host-header]
            local i hdr=()
            [ -n "${3:-}" ] && hdr=(-H "Host: $3")
            for i in $(seq 1 45); do
              if curl -fsS --max-time 3 "${hdr[@]}" "$2" >/dev/null 2>&1; then
                echo "    $1 healthy (${i}s): $2"
                return 0
              fi
              sleep 1
            done
            echo "::error::$1 not healthy after 45s: $2"
            return 1
          }
          tcp() { # name port
            local i
            for i in $(seq 1 45); do
              if timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/$2" >/dev/null 2>&1; then
                echo "    $1 accepting connections on tcp/$2 (${i}s)"
                return 0
              fi
              sleep 1
            done
            echo "::error::$1 not accepting connections on tcp/$2"
            return 1
          }

          rc=0
          probe gateway    "http://127.0.0.1:${GATEWAY_METRICS_PORT:-9102}/healthz" || rc=1
          # No Host header: the C# metrics listener binds the wildcard, so a
          # plain request from the host matches. If this ever 404s again, the
          # wildcard bind has regressed — do NOT paper over it with a header.
          probe gameserver "http://127.0.0.1:${GAMESERVER_METRICS_PORT:-9101}/healthz" || rc=1
          tcp   gateway    "${GATEWAY_CONTAINER_PORT:-8000}"                           || rc=1
          tcp   gameserver "${GAMESERVER_CONTAINER_PORT:-9200}"                        || rc=1
          docker ps --filter name=rpg- --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          if [ "$rc" != 0 ]; then
            echo "--- gateway logs ---";    docker logs --tail 50 rpg-gateway    2>&1 || true
            echo "--- gameserver logs ---"; docker logs --tail 50 rpg-gameserver 2>&1 || true
          fi
          exit "$rc"

  # ------------------------------------------------------- post-deploy smoke
  # Full-flow smoke test against the freshly deployed stack: Nakama health,
  # device auth, gateway_token RPC, gateway MsgAuth + MsgEnterWorld, game server
  # join, input/snapshot loop, clean disconnect. Runs on the same runner as
  # `deploy` (same labels) and reads env from the file the services read; values
  # are never echoed. Deliberately a separate job so a broken smoke test is
  # visibly distinct from a broken deploy.
  post-deploy-smoke:
    name: Post-deploy smoke test
    needs: [resolve, deploy]
    runs-on: ${{ fromJSON(needs.resolve.outputs.runner_labels) }}
    steps:
      - name: Run smoketest
        env:
          RPG_DEPLOY_DIR: ${{ needs.deploy.outputs.deploy_dir }}
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          . "$RPG_DEPLOY_DIR/deploy/.env"
          set +a
          "$RPG_DEPLOY_DIR/bin/smoketest"

  # ----------------------------------------------------------------- summary
  summary:
    name: Pipeline summary
    needs: [resolve, deploy, post-deploy-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write step summary
        run: |
          {
            echo "### CD — ${{ needs.resolve.outputs.environment }}"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| ref | \`${{ github.ref_name }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| runner | \`${{ join(fromJSON(needs.resolve.outputs.runner_labels), ', ') }}\` |"
            echo "| deploy dir | \`${{ needs.deploy.outputs.deploy_dir }}\` |"
            echo "| deploy mode | \`${{ needs.deploy.outputs.deploy_mode }}\` |"
            echo "| deploy | ${{ needs.deploy.result }} |"
            echo "| smoke test | ${{ needs['post-deploy-smoke'].result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
